<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tradelexity – Global Trade Finance Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE work: a statistics desk tool, calm and exact
   IDEA the trade ledger: every partner as a page of exports, imports and the balance between them
   PICTURE the 2015–2025 bar ledger per partner (exports mint, imports navy, balance marked) beside quarterly 2025–2026
   COLOUR white ground, near-black navy ink, mint and sage teal working colours, greys for context
   TYPE Almarai 800 for figures and titles, Almarai 400 for text
   LAYOUT search bar on top; partner title + four figures; chart full width; tables; ITC card; on phones everything stacks */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1620);--ink:light-dark(#131c27,#e8edf2);--mut:light-dark(#5f6874,#9aa6b2);--line:light-dark(#e2e6ea,#253141);--panel:light-dark(#ECEFF5,#16212d);--mint:#D4B85A;--sage:#B39020;--navy:light-dark(#0B193A,#9fb3d9);--grey:light-dark(#9aa1a9,#6d7883);--neg:light-dark(#b23a3a,#ef8d8d);--pos:light-dark(#2f7a52,#7fd3a5)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Almarai,Tahoma,sans-serif;overflow-x:clip}
.top{background:linear-gradient(135deg,#0B193A 0%,#173063 70%,#244176 100%);border-bottom:5px solid #D4B85A;color:#fff;padding:18px max(4vw,16px) 16px}
.top h1{margin:0;font-size:clamp(24px,4vw,34px);font-weight:800;line-height:1.1}
.top p{margin:4px 0 12px;color:#c9d2e3;font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar input{flex:1 1 220px;font:16px Almarai,sans-serif;padding:11px 14px;border-radius:10px;border:0;min-height:44px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:700 14px Almarai,sans-serif;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #2d4677;background:#ffffff0d;color:#e6ebf3;cursor:pointer}
.tabs button[aria-pressed=true]{background:#D4B85A;color:#0B193A;border-color:#D4B85A}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
#sugg{background:var(--bg);color:var(--ink);border-radius:10px;margin-top:6px;max-height:280px;overflow:auto;display:none;box-shadow:0 6px 18px #0003}
#sugg button{display:flex;justify-content:space-between;width:100%;text-align:start;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:15px Almarai,sans-serif;cursor:pointer;min-height:44px}
#sugg button span{color:var(--mut);font-size:13px}
main{padding:20px max(4vw,16px) 40px;max-width:1240px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h2{margin:0;font-size:clamp(26px,4vw,40px);line-height:1.05;font-weight:800}
.head .en{color:var(--mut);font-size:14px}
.unit{font-size:13px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:10px;margin:16px 0}
.k{background:var(--panel);border-radius:12px;padding:12px 14px}
.k b{display:block;font-size:clamp(20px,3vw,28px);font-weight:800;white-space:nowrap}
.k small{color:var(--mut);font-size:13px}
.k i{font-style:normal;font-size:13px;display:block}
.up{color:var(--pos)}.dn{color:var(--neg)}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{margin:0 0 8px;font-size:17px}
.fig{position:relative;min-height:300px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig.sm{min-height:240px}
svg text{font:12px Almarai,sans-serif;fill:var(--mut);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:6px}
.lg span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px;background:var(--c)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
th{color:var(--mut);font-weight:700;font-size:13px}
tr.sub td{color:var(--mut)}
.rank{display:grid;gap:6px}
.row{display:grid;grid-template-columns:2em 9.5em minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px;cursor:pointer;border:0;background:none;color:inherit;text-align:start;font-family:inherit;padding:4px 0;min-height:36px}
.row:hover .nm{text-decoration:underline}
.trk{height:14px;background:var(--panel);border-radius:4px;overflow:hidden;display:flex}

.v{font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
select{font:15px Almarai,sans-serif;min-height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.itc{background:linear-gradient(0deg,var(--panel),var(--panel));border-inline-start:6px solid var(--sage)}
.itc dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:8px;margin:8px 0}
.itc dt{font-size:13px;color:var(--mut)}.itc dd{margin:0;font-weight:800;font-size:20px}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.copy{font:700 14px Almarai,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--sage);color:#fff;cursor:pointer}
.cur{display:inline-flex;gap:0;margin-inline-start:8px;vertical-align:middle}.cur button{font:700 13px Almarai,sans-serif;min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}.cur button:first-child{border-radius:0 8px 8px 0}.cur button:last-child{border-radius:8px 0 0 8px}.cur button[aria-pressed=true]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.lead{margin:12px 0 0;font-size:16px;line-height:1.8;background:var(--panel);border-inline-start:5px solid var(--sage);padding:10px 14px;border-radius:8px}
.agr{margin-top:8px;font-size:14px;color:var(--mut)}.agr b{color:var(--ink)}
.k .mp{display:block;margin-top:4px;color:var(--ink);font-weight:700;font-size:12.5px;white-space:normal}
.inds{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:8px}.inds div{background:var(--panel);border-radius:10px;padding:10px 12px}.inds small{display:block;color:var(--mut);font-size:13px}.inds b{font-size:18px;font-weight:800}
.ibs{display:grid;grid-template-columns:repeat(auto-fit,minmax(17em,1fr));gap:12px;margin-top:10px}.ib{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}.ib h4{margin:0;font-size:16px}.ib>small{color:var(--mut);font-size:13px}.ib.food{margin-top:12px;border-color:var(--mint)}
.bar2{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 8px}.bar2 i{display:block;height:100%;background:var(--mint)}
.pr{font-size:14px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(18em,1fr));gap:16px}
.rep h4{margin:14px 0 6px}.rep ul,.rep ol{margin:4px 0;padding-inline-start:20px}.rep p{margin:4px 0 8px;line-height:1.8}
tr.hl td{background:var(--panel);font-weight:700}
.fch{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:0 12px}.fch summary{cursor:pointer;padding:12px 0;display:flex;gap:8px;align-items:center;font-size:15px}.fch summary .v{margin-inline-start:auto;font-weight:800}.fch[open] summary{border-bottom:1px solid var(--line)}
tr.fr{cursor:pointer}tr.fr:hover td{background:var(--panel)}tr.fx>td{padding:8px 0;white-space:normal}.fi{margin:6px 0}a.row{text-decoration:none}.k a,td a{color:var(--navy);font-weight:700}
.fsug{display:none;border:1px solid var(--line);border-radius:10px;margin-top:-8px;margin-bottom:12px;max-height:300px;overflow:auto;box-shadow:0 6px 18px #0002;background:var(--bg)}.fsug button{display:flex;gap:8px;width:100%;text-align:start;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:15px Almarai,sans-serif;cursor:pointer;min-height:44px;align-items:center}.fsug button b{color:var(--navy)}.fsug button span{margin-inline-start:auto;color:var(--mut);font-size:13px}
tr.sep td{background:var(--navy);color:var(--bg);font-weight:800;font-size:13px;padding:6px 8px;border-top:3px solid var(--mint)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chip{font:700 13px Almarai,sans-serif;border:1px solid var(--navy);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer}.chip.clr{border-color:var(--line);color:var(--mut)}
.fsug button.all{font-weight:800;color:var(--sage)}.fsug button.on{background:var(--panel)}
table.fct td{padding:10px 8px}tr.fc{cursor:pointer}tr.fc:hover td,tr.fc.open td{background:var(--panel)}tr.fc td:first-child b{color:var(--navy)}.cnt{color:var(--mut);font-size:12px;font-weight:400}
tr.fx>td,tr.fy>td{padding:4px 0 10px;white-space:normal}table.sub{font-size:13px;background:var(--bg)}table.sub th{font-size:12px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.mh h3{margin:0}.mapw{position:relative;margin-top:8px}.mapw svg{width:100%;height:auto;display:block}
.ctry{cursor:pointer;transition:opacity .15s}.ctry:hover{opacity:.75;stroke:var(--ink);stroke-width:.8}
.mtip{position:absolute;display:none;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 4px 14px #0003;white-space:nowrap;z-index:2}
.flowg{display:grid;grid-template-columns:minmax(0,2fr) minmax(12em,1fr);gap:12px;align-items:center}@media(max-width:640px){.flowg{grid-template-columns:1fr}}
.flowg svg{width:100%;height:auto;display:block;border-radius:10px;background:light-dark(#f7f9fc,#121c27)}
.arc{fill:none;stroke-linecap:round;stroke-dasharray:6 5;animation:flow 1.6s linear infinite}.ax{stroke:var(--mint)}.am{stroke:var(--navy)}@keyframes flow{to{stroke-dashoffset:-22}}
@media(prefers-reduced-motion:reduce){.arc{animation:none}}
.ml{font-family:Almarai,sans-serif;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:.25em}
.fh{margin:0 0 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.fh .dk,.fh .dc{width:12px;height:12px;border-radius:50%;display:inline-block}.fh .dk{background:var(--navy)}.fh .dc{background:var(--sage)}.fh .ar{color:var(--mint)}
.fleg{display:grid;gap:8px}.fleg div{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--panel);border-radius:8px;padding:8px 10px}.fleg i{width:14px;height:14px;border-radius:3px;flex:none}.fleg b{margin-inline-start:auto;font-size:18px}.fleg small{color:var(--mut)}

/* ---- combined layout ---- */
#vEnt.isK .kpis,#vEnt.isK #lead{display:none!important}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
@media(max-width:820px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bento .t{background:var(--panel);border-radius:22px;padding:16px;position:relative;overflow:hidden;color:inherit;text-decoration:none;min-height:118px;display:block}
.bento .t small{display:block;color:var(--mut);font-size:13px}.bento .t b{display:block;font-size:clamp(22px,3.2vw,30px);font-weight:800;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.bento .w2{grid-column:span 2}.bento .w4{grid-column:1/-1;background:var(--bg);border:1px solid var(--line)}table.cmp{font-size:12px}table.cmp th{white-space:normal;vertical-align:bottom;line-height:1.3}table.cmp td,table.cmp th{padding:8px 4px}table.cmp td:first-child{font-weight:700;white-space:normal;min-width:5.5em}table.cmp tr.chg td{border-top:2px solid var(--ink);font-weight:800}.bento .dark{background:#0B193A;color:#fff}.bento .dark small{color:#b9c6dc}.bento .gold{background:#D4B85A;color:#0B193A}.bento .gold small{color:#4b3d12}
.bento .dark .up{color:#9fe3b8}.bento .dark .dn{color:#ffa3a3}
.mini{display:flex;align-items:flex-end;gap:5px;height:56px;margin-top:10px}.mini i{flex:1;background:#D4B85A;border-radius:5px 5px 0 0;min-height:3px}
.mlab{display:flex;gap:5px;font-size:11px;color:#b9c6dc;margin-top:3px}.mlab span{flex:1;text-align:center}
.th{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.th b{font-size:16px!important;margin:0!important}.th a{color:var(--sage);font-weight:700;text-decoration:none;font-size:14px}
.lr{display:grid;grid-template-columns:1.4em 8.5em 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-size:14px}.lr:last-child{border:0}
.lr .no{color:var(--sage);font-weight:800}.lr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lr .tr{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.lr .tr i{display:block;height:100%;background:var(--navy)}.lr b{font-size:14px!important;margin:0!important}
.bento .lnk .go{position:absolute;bottom:12px;left:14px;width:30px;height:30px;border-radius:50%;background:#0000000f;display:grid;place-items:center;font-weight:800}.bento .dark .go{background:#ffffff1f}
.bento .food{background:light-dark(#f3ecd6,#2a2412)}

body.noscroll{overflow:hidden}

<script>
/* rotating dotted globe for every canvas.spin */
(()=>{const G=[];const pts=[];for(let la=-81;la<=81;la+=9)for(let lo=-180;lo<180;lo+=9)pts.push([la*Math.PI/180,lo*Math.PI/180]);
const tilt=18*Math.PI/180,KW=[29.3*Math.PI/180,47.9*Math.PI/180],t0=performance.now(),RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(cv,now){const r=cv.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(devicePixelRatio||1,2),S=r.width;if(cv.width!==Math.round(S*dpr)){cv.width=Math.round(S*dpr);cv.height=Math.round(S*dpr);}
 const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,S,S);const R=S*.46,C=S/2,t=RM?2:now,l0=(-110+t*40)*Math.PI/180;
 const P=(phi,lam)=>{const L=lam-l0,X=Math.cos(phi)*Math.sin(L),Y=Math.cos(tilt)*Math.sin(phi)-Math.sin(tilt)*Math.cos(phi)*Math.cos(L),Z=Math.sin(tilt)*Math.sin(phi)+Math.cos(tilt)*Math.cos(phi)*Math.cos(L);return [C+R*X,C-R*Y,Z];};
 for(const [p,l] of pts){const [px,py,z]=P(p,l);if(z<=0.02)continue;x.globalAlpha=.25+.75*z;x.fillStyle='#D4B85A';x.beginPath();x.arc(px,py,(R/95)*(1.1+1.9*z),0,7);x.fill();}
 const [kx,ky,kz]=P(KW[0],KW[1]);if(kz>0){x.globalAlpha=Math.min(1,kz*1.6);const g=x.createRadialGradient(kx,ky,0,kx,ky,R*.22);g.addColorStop(0,'rgba(255,255,255,.7)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.arc(kx,ky,R*.22,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(kx,ky,R*.07,0,7);x.fill();}
 x.globalAlpha=1;}
let last=0,tt=2;function loop(now){const dt=last?Math.min((now-last)/1000,1/30):0;last=now;tt+=dt;if(!document.querySelector('.tsp'))document.querySelectorAll('canvas.spin').forEach(cv=>{if(cv.offsetParent!==null)draw(cv,tt);});if(!RM)requestAnimationFrame(loop);}
requestAnimationFrame(loop);})();
</script>

    ${(()=>{const [y,v]=last(F.FDIIN);return y?k(L('الاستثمار الأجنبي المباشر الوارد ','Inward FDI ')+y,`<span dir="ltr">${sg(toC(v))}</span>`,L('مليار ','billion ')+csym(),'fdi'):'';})()}
   </div>
   ${card(L('النمو الاقتصادي الحقيقي (%)','Real GDP growth (%)'),'',bars(F.NGDP_RPCH)+legend())}`;}
function output(){const ser={};Object.entries(F.NGDPD).forEach(([y,v])=>ser[y]=toC(v));
  $('#vOut').innerHTML=`<div class="fh"><h2>${T_NAV[0]}</h2><span class="sub">${L('مليار','billion')} ${csym()}</span></div>
   <div class="fgrid">${k(L('الناتج المحلي 2025','GDP 2025'),fmt(toC(F.NGDPD['2025'])),L('مليار ','billion ')+csym())}${k(L('النمو الحقيقي 2025','Real growth 2025'),`<span class="${tone(F.NGDP_RPCH['2025'])}" dir="ltr">${sg(F.NGDP_RPCH['2025'])}%</span>`,L('تقدير 2026: ','2026 proj.: ')+'<span dir="ltr">'+sg(F.NGDP_RPCH['2026'])+'%</span>')}
   ${k(L('نصيب الفرد 2025','GDP per capita 2025'),'$'+fmt(F.NGDPDPC['2025'],0),L('بالدولار','US dollars'))}${k(L('عدد السكان 2025','Population 2025'),fmt(F.LP['2025'],2),L('مليون نسمة','million'))}</div>
   ${card(L('الناتج المحلي الإجمالي الاسمي','Nominal GDP'),L('مليار ','billion ')+csym(),bars(ser,{neg:false})+legend())}
   <div class="two">${card(L('النمو الحقيقي – دول مجلس التعاون 2025','Real growth – GCC 2025'),'',cmp('NGDP_RPCH','2025'))}${card(L('نصيب الفرد من الناتج – دول المجلس 2025','GDP per capita – GCC 2025'),L('ألف دولار','US$ thousand'),cmp('PCK','2025',{suf:''}))}</div>
   ${card(L('نصيب الفرد من الناتج المحلي','GDP per capita'),L('ألف دولار','US$ thousand'),bars(Object.fromEntries(Object.entries(F.NGDPDPC).map(([y,v])=>[y,v/1000])),{neg:false})+legend())}`;}
function monetary(){const rs={};Object.entries(F.RES).forEach(([y,v])=>rs[y]=toC(v));
  $('#vMon').innerHTML=`<div class="fh"><h2>${T_NAV[1]}</h2></div>
   <div class="fgrid">${k(L(F.POL.ar,F.POL.en),fmt(F.POL.v,2)+'%',L('آخر تعديل ','Last change ')+F.POL.d)}${F.POL.v2?k(L(F.POL.ar2,F.POL.en2),fmt(F.POL.v2,2)+'%',''):''}
   ${k(L('سعر الصرف','Exchange rate'),fmt(F.FX.v,4),L(F.FX.peg+' · '+C.cs+' لكل دولار',F.FX.pegE+' · '+C.csE+' per USD'))}${k(L('التضخم 2025','Inflation 2025'),fmt(F.PCPIPCH['2025'])+'%',L('تقدير 2026: ','2026 proj.: ')+'<span dir="ltr">'+fmt(F.PCPIPCH['2026'])+'%</span>')}
   ${(()=>{const [y,v]=last(F.M2G);return y?k(L('نمو عرض النقد (M2) ','Broad money growth ')+y,`<span dir="ltr">${sg(v)}%</span>`,''):'';})()}
   ${(()=>{const [y,v]=last(F.LEND);return y?k(L('متوسط سعر الإقراض ','Avg. lending rate ')+y,fmt(v,2)+'%',''):'';})()}
   ${(()=>{const [y,v]=last(F.RESM);return y?k(L('تغطية الاحتياطيات ','Reserve cover ')+y,fmt(v)+' '+L('أشهر','months'),L('من الواردات','of imports')):'';})()}</div>
   ${card(L('التضخم – أسعار المستهلك (%)','Inflation – consumer prices (%)'),'',bars(F.PCPIPCH)+legend())}
   ${card(L('الاحتياطيات الأجنبية الرسمية','Official foreign reserves'),L('مليار ','billion ')+csym()+L(' (تشمل الذهب)',' (incl. gold)'),bars(rs,{neg:false}))}
   ${Object.keys(F.M2G||{}).length?card(L('نمو عرض النقد بمفهومه الواسع (%)','Broad money growth (%)'),'',bars(F.M2G)):''}
   ${card(L('التضخم – دول مجلس التعاون 2025','Inflation – GCC 2025'),'',cmp('PCPIPCH','2025'))}`;}
function fiscal(){$('#vFis').innerHTML=`<div class="fh"><h2>${T_NAV[2]}</h2><span class="sub">${L('% من الناتج المحلي الإجمالي','% of GDP')}</span></div>
   <div class="fgrid">${k(L('رصيد المالية العامة 2025','Fiscal balance 2025'),`<span class="${tone(F.GGXCNL_NGDP['2025'])}" dir="ltr">${sg(F.GGXCNL_NGDP['2025'])}%</span>`,F.GGXCNL_NGDP['2025']>=0?L('فائض','Surplus'):L('عجز','Deficit'))}
   ${k(L('تقدير 2026','2026 projection'),`<span class="${tone(F.GGXCNL_NGDP['2026'])}" dir="ltr">${sg(F.GGXCNL_NGDP['2026'])}%</span>`,'')}
   ${k(L('الدين الحكومي الإجمالي 2025','Gross government debt 2025'),fmt(F.GGXWDG_NGDP['2025'])+'%',L('تقدير 2026: ','2026 proj.: ')+'<span dir="ltr">'+fmt(F.GGXWDG_NGDP['2026'])+'%</span>')}
   ${k(L('الدين الحكومي بالقيمة 2025','Government debt value 2025'),fmt(toC(F.GGXWDG_NGDP['2025']*F.NGDPD['2025']/100)),L('مليار ','billion ')+csym())}</div>
   ${card(L('رصيد المالية العامة (صافي الإقراض/الاقتراض)','Fiscal balance (net lending/borrowing)'),L('% من الناتج المحلي','% of GDP'),bars(F.GGXCNL_NGDP)+legend())}
   ${card(L('إجمالي الدين الحكومي','Gross government debt'),L('% من الناتج المحلي','% of GDP'),bars(F.GGXWDG_NGDP,{neg:false})+legend())}
   <div class="two">${card(L('رصيد المالية العامة – دول المجلس 2025','Fiscal balance – GCC 2025'),'',cmp('GGXCNL_NGDP','2025'))}${card(L('الدين الحكومي – دول المجلس 2025','Government debt – GCC 2025'),'',cmp('GGXWDG_NGDP','2025'))}</div>`;}
function external(){const ca={};Object.entries(F.BCA).forEach(([y,v])=>ca[y]=toC(v));
  const tb={};Object.entries(TB).forEach(([y,v])=>tb[y]=CUR==='usd'?v/F.FX.v:v);
  const [ty,tv]=last(tb),[fy,fv]=last(F.FDI);
  $('#vExt').innerHTML=`<div class="fh"><h2>${T_NAV[4]}</h2><span class="sub">${L('مليار','billion')} ${csym()}</span></div>
   <div class="fgrid">${k(L('الحساب الجاري 2025','Current account 2025'),`<span class="${tone(F.BCA['2025'])}" dir="ltr">${sg(toC(F.BCA['2025']))}</span>`,L('مليار ','billion ')+csym()+' · <span dir="ltr">'+sg(F.BCA_NGDPD['2025'])+'%</span> '+L('من الناتج','of GDP'))}
   ${ty?k(L('الميزان التجاري السلعي ','Goods trade balance ')+ty,`<span class="${tone(tv)}" dir="ltr">${sg(tv)}</span>`,L('مليار ','billion ')+csym(),'trade'):''}
   ${(()=>{const [y,v]=last(F.EXPGDP);return y?k(L('صادرات السلع والخدمات ','Exports of goods & services ')+y,fmt(v)+'%',L('من الناتج','of GDP')):'';})()}
   ${(()=>{const [y,v]=last(F.IMPGDP);return y?k(L('واردات السلع والخدمات ','Imports of goods & services ')+y,fmt(v)+'%',L('من الناتج','of GDP')):'';})()}
   ${fy?k(L('صافي تدفقات الاستثمار الأجنبي المباشر ','FDI net inflows ')+fy,`<span dir="ltr">${sg(fv,2)}%</span>`,L('من الناتج','of GDP')):''}</div>
   ${card(L('رصيد الحساب الجاري','Current account balance'),L('مليار ','billion ')+csym(),bars(ca)+legend())}
   ${Object.keys(tb).length?card(L('الميزان التجاري السلعي (الصادرات − الواردات)','Goods trade balance (exports − imports)'),L('مليار ','billion ')+csym()+'',bars(tb,{pj:9999})):''}
   ${card(L('الحساب الجاري – دول المجلس 2025','Current account – GCC 2025'),L('% من الناتج المحلي','% of GDP'),cmp('BCA_NGDPD','2025'))}`;}
const NOTCH={'AAA':22,'AA+':21,'AA':20,'AA-':19,'A+':18,'A':17,'A-':16,'BBB+':15,'BBB':14,'BBB-':13,'BB+':12,'BB':11,'BB-':10,'B+':9,'B':8,'B-':7,'CCC+':6,'CCC':5,
 'Aaa':22,'Aa1':21,'Aa2':20,'Aa3':19,'A1':18,'A2':17,'A3':16,'Baa1':15,'Baa2':14,'Baa3':13,'Ba1':12,'Ba2':11,'Ba3':10,'B1':9,'B2':8,'B3':7,'Caa1':6};
const OUT={S:['مستقرة','Stable','#9fb3d9'],N:['سلبية','Negative','#e07a7a'],P:['إيجابية','Positive','#7fd3a5']};
const AG=[['sp','ستاندرد آند بورز','S&P Global'],['md','موديز','Moody\'s'],['ft','فيتش','Fitch']];
const grade=n=>n>=13?L('درجة استثمارية','Investment grade'):L('درجة مضاربية','Speculative grade');
function rating(){const R=F.RAT;
  const meter=(r)=>{const n=NOTCH[r]||0,pct=(n-6)/(22-6)*100;return `<div style="position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,#e07a7a,#D4B85A 45%,#7fd3a5);margin:10px 0 4px;direction:ltr"><i style="position:absolute;left:${(13-6)/16*100}%;top:-4px;bottom:-4px;width:2px;background:#fff8"></i><b style="position:absolute;left:calc(${pct}% - 7px);top:-4px;width:14px;height:18px;border-radius:5px;background:#fff;box-shadow:0 0 10px #D4B85A"></b></div>`;};
  $('#vRat').innerHTML=`<div class="fh"><h2>${T_NAV[6]}</h2><span class="sub">${L('التصنيف السيادي طويل الأجل بالعملة الأجنبية','Long-term foreign-currency sovereign rating')}</span></div>
   <div class="fgrid">${AG.map(([a,ar,en])=>{const [r,o]=R[a],ot=OUT[o];return `<div class="fk"><small>${L(ar,en)}</small><b style="font-size:34px">${r}</b><em>${L('النظرة المستقبلية: ','Outlook: ')}<span style="color:${ot[2]};font-weight:800">${L(ot[0],ot[1])}</span> · ${grade(NOTCH[r])}</em>${meter(r)}</div>`;}).join('')}</div>
   ${R.note?`<div class="note">${L('تصنيفا ستاندرد آند بورز وفيتش لحكومة أبوظبي؛ وتصنيف موديز لحكومة دولة الإمارات.','S&P and Fitch ratings are for the Abu Dhabi government; Moody\'s rating is for the UAE federal government.')}</div>`:''}
   ${card(L('مقارنة التصنيفات – دول مجلس التعاون','Ratings comparison – GCC'),L('مرتبة من الأعلى تصنيفاً','Ranked from highest rated'),
    `<div class="scroll"><table style="width:100%;border-collapse:collapse;font-size:14px"><thead><tr><th style="text-align:start;padding:6px">${L('الدولة','Country')}</th>${AG.map(([a,ar,en])=>`<th style="padding:6px">${L(ar,en)}</th>`).join('')}</tr></thead><tbody>${ORDER.slice().sort((x,y)=>(NOTCH[ALL[y].RAT.sp[0]]+NOTCH[ALL[y].RAT.md[0]])-(NOTCH[ALL[x].RAT.sp[0]]+NOTCH[ALL[x].RAT.md[0]])).map(c=>`<tr style="border-top:1px solid var(--line);${c===CTRY?'background:#D4B85A1f;font-weight:800':''}"><td style="padding:8px 6px"><img src="cflags/${CF[c].iso}.svg" alt="" style="width:18px;height:18px;border-radius:50%;vertical-align:-4px;margin-inline-end:6px">${EN?CF[c].en:CF[c].ar}</td>${AG.map(([a])=>{const [r,o]=ALL[c].RAT[a];return `<td style="text-align:center;padding:8px 4px"><b>${r}</b>${o!=='S'?` <span style="color:${OUT[o][2]};font-size:11px">${L(OUT[o][0],OUT[o][1])}</span>`:''}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>`)}
   <div class="note">${L('الخط الأبيض في المؤشر يمثل الحد الأدنى للدرجة الاستثمارية (BBB- / Baa3). التصنيفات كما في نوفمبر 2026.','The white line on the scale marks the investment-grade threshold (BBB- / Baa3). Ratings as of November 2026.')}</div>`;}
function fdi(){const inn={},out={};Object.entries(F.FDIIN).forEach(([y,v])=>inn[y]=toC(v));Object.entries(F.FDIOUT).forEach(([y,v])=>out[y]=toC(v));
  const [y,vi]=last(inn),vo=out[y],[gy,gv]=last(F.FDI),cum=Object.entries(inn).filter(([k])=>k>='2021').reduce((a,[,v])=>a+v,0);
  ORDER.forEach(c=>{ALL[c].FDIG=ALL[c].FDIG||{};ALL[c].FDIG['2025']=ALL[c].FDIIN['2025'];});
  $('#vFdi').innerHTML=`<div class="fh"><h2>${T_NAV[5]}</h2><span class="sub">${L('مليار','billion')} ${csym()}</span></div>
   <div class="fgrid">${k(L('التدفقات الواردة ','Inward flows ')+y,`<span dir="ltr">${sg(vi)}</span>`,L('مليار ','billion ')+csym())}${k(L('التدفقات الصادرة ','Outward flows ')+y,`<span dir="ltr">${sg(vo)}</span>`,L('مليار ','billion ')+csym())}
   ${k(L('صافي الاستثمار المباشر ','Net direct investment ')+y,`<span class="${tone(vi-vo)}" dir="ltr">${sg(vi-vo)}</span>`,L('الوارد − الصادر','Inward − outward'))}${gy?k(L('الوارد كنسبة من الناتج ','Inward as % of GDP ')+gy,`<span dir="ltr">${sg(gv,2)}%</span>`,''):''}
   ${k(L('مجموع التدفقات الواردة 2021–'+y,'Cumulative inflows 2021–'+y),fmt(cum),L('مليار ','billion ')+csym())}</div>
   ${card(L('تدفقات الاستثمار الأجنبي المباشر الواردة','Inward FDI flows'),L('مليار ','billion ')+csym(),bars(inn))}
   ${card(L('تدفقات الاستثمار المباشر الصادرة','Outward FDI flows'),L('مليار ','billion ')+csym(),bars(out,{color:'#9fb3d9'}))}
   ${card(L('التدفقات الواردة – دول المجلس 2025','Inward FDI – GCC 2025'),L('مليار دولار','US$ billion'),cmp('FDIG','2025',{suf:''}))}`;}
const V={home:['vHome',home],fdi:['vFdi',fdi],rating:['vRat',rating],output:['vOut',output],monetary:['vMon',monetary],fiscal:['vFis',fiscal],external:['vExt',external]};
function route(){const h=(location.hash||'#home').slice(1),v=V[h]?h:'home';document.querySelectorAll('.fsec').forEach(s=>s.classList.remove('on'));
  const [id,fn]=V[v];fn();$('#'+id).classList.add('on');
  document.querySelectorAll('.bnav button,.ftabs button').forEach(b=>b.classList.toggle('on',b.dataset.go===v));
  document.querySelectorAll('[data-go]').forEach(e=>{if(!e.closest('.bnav,.ftabs'))e.onclick=()=>{const g=e.dataset.go;if(g==='trade')location.href=$('#swT').href;else location.hash=g;};});
  countUp($('#'+id));window.scrollTo({top:0,behavior:'instant'});}
function countUp(root){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;root.querySelectorAll('.fk b,.fhero>b').forEach(el=>{const t=el.querySelector('span')||el,raw=t.textContent,m=raw.match(/^([^\d]*?)(\d[\d,]*(?:\.\d+)?)(.*)$/s);if(!m)return;
  const dec=(m[2].split('.')[1]||'').length,tg=parseFloat(m[2].replace(/,/g,''));if(!tg)return;const t0=performance.now();
  const st=n=>{const q=Math.min((n-t0)/1100,1),e=1-Math.pow(1-q,3);t.textContent=m[1]+(tg*e).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec})+m[3];if(q<1)requestAnimationFrame(st);else t.textContent=raw;};requestAnimationFrame(st);});}
document.querySelectorAll('.bnav button,.ftabs button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.go;});
$('#cLoc').onclick=()=>{CUR='loc';$('#cLoc').setAttribute('aria-pressed','true');$('#cUsd').setAttribute('aria-pressed','false');route();};
$('#cUsd').onclick=()=>{CUR='usd';$('#cUsd').setAttribute('aria-pressed','true');$('#cLoc').setAttribute('aria-pressed','false');route();};
window.addEventListener('hashchange',route);
Promise.all([fetch('fin.json').then(r=>r.json()),fetch(CTRY==='KW'?'data.json':'data_'+CTRY+'.json').then(r=>r.json()).catch(()=>[])]).then(([fj,td])=>{
  ALL=fj.c;F=ALL[CTRY];ORDER.forEach(c=>{ALL[c].PCK={};Object.entries(ALL[c].NGDPDPC).forEach(([y,v])=>ALL[c].PCK[y]=v/1000);});
  td.forEach(r=>{if(r.t==='total'&&/^\d{4}$/.test(r.p)&&r.p>='2015')TB[r.p]=(r.x-r.m)/1e6;});
  $('#cLoc').textContent=EN?C.csE:C.cs;route();}).catch(e=>{console.error('FINERR',e);});

</script>
</body>
</html>
