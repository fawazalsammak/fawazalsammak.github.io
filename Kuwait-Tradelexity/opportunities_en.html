<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="utf-8"><meta name="color-scheme" content="dark"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tradelexity – Trade Opportunities</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE work: a statistics desk tool, calm and exact
   IDEA the trade ledger: every partner as a page of exports, imports and the balance between them
   PICTURE the 2015–2025 bar ledger per partner (exports mint, imports navy, balance marked) beside quarterly 2025–2026
   COLOUR white ground, near-black navy ink, mint and sage teal working colours, greys for context
   TYPE Noto Naskh Arabic 800 for figures and titles, Noto Naskh Arabic 400 for text
   LAYOUT search bar on top; partner title + four figures; chart full width; tables; ITC card; on phones everything stacks */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1620);--ink:light-dark(#131c27,#e8edf2);--mut:light-dark(#5f6874,#9aa6b2);--line:light-dark(#e2e6ea,#253141);--panel:light-dark(#ECEFF5,#16212d);--mint:#D4B85A;--sage:#B39020;--navy:light-dark(#0B193A,#9fb3d9);--grey:light-dark(#9aa1a9,#6d7883);--neg:light-dark(#b23a3a,#ef8d8d);--pos:light-dark(#2f7a52,#7fd3a5)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Noto Naskh Arabic,Tahoma,sans-serif;overflow-x:clip}
.top{background:linear-gradient(135deg,#0B193A 0%,#173063 70%,#244176 100%);border-bottom:5px solid #D4B85A;color:#fff;padding:18px max(4vw,16px) 16px}
.top h1{margin:0;font-size:clamp(24px,4vw,34px);font-weight:800;line-height:1.1}
.top p{margin:4px 0 12px;color:#c9d2e3;font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar input{flex:1 1 220px;font:16px Noto Naskh Arabic,sans-serif;padding:11px 14px;border-radius:10px;border:0;min-height:44px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:700 14px Noto Naskh Arabic,sans-serif;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #2d4677;background:#ffffff0d;color:#e6ebf3;cursor:pointer}
.tabs button[aria-pressed=true]{background:#D4B85A;color:#0B193A;border-color:#D4B85A}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
#sugg{background:var(--bg);color:var(--ink);border-radius:10px;margin-top:6px;max-height:280px;overflow:auto;display:none;box-shadow:0 6px 18px #0003}
#sugg button{display:flex;justify-content:space-between;width:100%;text-align:start;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:15px Noto Naskh Arabic,sans-serif;cursor:pointer;min-height:44px}
#sugg button span{color:var(--mut);font-size:13px}
main{padding:20px max(4vw,16px) 40px;max-width:1240px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h2{margin:0;font-size:clamp(26px,4vw,40px);line-height:1.05;font-weight:800}
.head .en{color:var(--mut);font-size:14px}
.unit{font-size:13px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:10px;margin:16px 0}
.k{background:var(--panel);border-radius:12px;padding:12px 14px}
.k b{display:block;font-size:clamp(20px,3vw,28px);font-weight:800;white-space:nowrap}
.k small{color:var(--mut);font-size:13px}
.k i{font-style:normal;font-size:13px;display:block}
.up{color:var(--pos)}.dn{color:var(--neg)}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{margin:0 0 8px;font-size:17px}
.fig{position:relative;min-height:300px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig.sm{min-height:240px}
svg text{font:12px Noto Naskh Arabic,sans-serif;fill:var(--mut);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:6px}
.lg span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px;background:var(--c)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
th{color:var(--mut);font-weight:700;font-size:13px}
tr.sub td{color:var(--mut)}
.rank{display:grid;gap:6px}
.row{display:grid;grid-template-columns:2em 9.5em minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px;cursor:pointer;border:0;background:none;color:inherit;text-align:start;font-family:inherit;padding:4px 0;min-height:36px}
.row:hover .nm{color:#D4B85A}
.trk{height:14px;background:var(--panel);border-radius:4px;overflow:hidden;display:flex}
.trk i{display:block;height:100%}
.v{font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
select{font:15px Noto Naskh Arabic,sans-serif;min-height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.itc{background:linear-gradient(0deg,var(--panel),var(--panel));border-inline-start:6px solid var(--sage)}
.itc dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:8px;margin:8px 0}
.itc dt{font-size:13px;color:var(--mut)}.itc dd{margin:0;font-weight:800;font-size:20px}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.copy{font:700 14px Noto Naskh Arabic,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--sage);color:#fff;cursor:pointer}
.cur{display:inline-flex;gap:0;margin-inline-start:8px;vertical-align:middle}.cur button{font:700 13px Noto Naskh Arabic,sans-serif;min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}.cur button:first-child{border-radius:0 8px 8px 0}.cur button:last-child{border-radius:8px 0 0 8px}.cur button[aria-pressed=true]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.lead{margin:12px 0 0;font-size:16px;line-height:1.8;background:var(--panel);border-inline-start:5px solid var(--sage);padding:10px 14px;border-radius:8px}
.agr{margin-top:8px;font-size:14px;color:var(--mut)}.agr b{color:var(--ink)}
.k .mp{display:block;margin-top:4px;color:var(--ink);font-weight:700;font-size:12.5px;white-space:normal}
.inds{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:8px}.inds div{background:var(--panel);border-radius:10px;padding:10px 12px}.inds small{display:block;color:var(--mut);font-size:13px}.inds b{font-size:18px;font-weight:800}
.ibs{display:grid;grid-template-columns:repeat(auto-fit,minmax(17em,1fr));gap:12px;margin-top:10px}.ib{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}.ib h4{margin:0;font-size:16px}.ib>small{color:var(--mut);font-size:13px}.ib.food{margin-top:12px;border-color:var(--mint)}
.bar2{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 8px}.bar2 i{display:block;height:100%;background:var(--mint)}
.pr{font-size:14px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(18em,1fr));gap:16px}
.rep h4{margin:14px 0 6px}.rep ul,.rep ol{margin:4px 0;padding-inline-start:20px}.rep p{margin:4px 0 8px;line-height:1.8}
tr.hl td{background:var(--panel);font-weight:700}
.fch{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:0 12px}.fch summary{cursor:pointer;padding:12px 0;display:flex;gap:8px;align-items:center;font-size:15px}.fch summary .v{margin-inline-start:auto;font-weight:800}.fch[open] summary{border-bottom:1px solid var(--line)}
tr.fr{cursor:pointer}tr.fr:hover td{background:var(--panel)}tr.fx>td{padding:8px 0;white-space:normal}.fi{margin:6px 0}a.row{text-decoration:none}.k a,td a{color:var(--navy);font-weight:700}
.fsug{display:none;border:1px solid var(--line);border-radius:10px;margin-top:-8px;margin-bottom:12px;max-height:300px;overflow:auto;box-shadow:0 6px 18px #0002;background:var(--bg)}.fsug button{display:flex;gap:8px;width:100%;text-align:start;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:15px Noto Naskh Arabic,sans-serif;cursor:pointer;min-height:44px;align-items:center}.fsug button b{color:var(--navy)}.fsug button span{margin-inline-start:auto;color:var(--mut);font-size:13px}
tr.sep td{background:var(--navy);color:var(--bg);font-weight:800;font-size:13px;padding:6px 8px;border-top:3px solid var(--mint)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chip{font:700 13px Noto Naskh Arabic,sans-serif;border:1px solid var(--navy);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer}.chip.clr{border-color:var(--line);color:var(--mut)}
.fsug button.all{font-weight:800;color:var(--sage)}.fsug button.on{background:var(--panel)}
table.fct td{padding:10px 8px}tr.fc{cursor:pointer}tr.fc:hover td,tr.fc.open td{background:var(--panel)}tr.fc td:first-child b{color:var(--navy)}.cnt{color:var(--mut);font-size:12px;font-weight:400}
tr.fx>td,tr.fy>td{padding:4px 0 10px;white-space:normal}table.sub{font-size:13px;background:var(--bg)}table.sub th{font-size:12px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.mh h3{margin:0}.mapw{position:relative;margin-top:8px}.mapw svg{width:100%;height:auto;display:block}
.ctry{cursor:pointer;transition:opacity .15s}.ctry:hover{opacity:.75;stroke:var(--ink);stroke-width:.8}
.mtip{position:absolute;display:none;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 4px 14px #0003;white-space:nowrap;z-index:2}
.flowg{display:grid;grid-template-columns:minmax(0,2fr) minmax(12em,1fr);gap:12px;align-items:center}@media(max-width:640px){.flowg{grid-template-columns:1fr}}
.flowg svg{width:100%;height:auto;display:block;border-radius:10px;background:light-dark(#f7f9fc,#121c27)}
.arc{fill:none;stroke-linecap:round;stroke-dasharray:6 5;animation:flow 1.6s linear infinite}.ax{stroke:var(--mint)}.am{stroke:var(--navy)}@keyframes flow{to{stroke-dashoffset:-22}}
@media(prefers-reduced-motion:reduce){.arc{animation:none}}
.ml{font-family:Noto Naskh Arabic,sans-serif;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:.25em}
.fh{margin:0 0 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.fh .dk,.fh .dc{width:12px;height:12px;border-radius:50%;display:inline-block}.fh .dk{background:var(--navy)}.fh .dc{background:var(--sage)}.fh .ar{color:var(--mint)}
.fleg{display:grid;gap:8px}.fleg div{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--panel);border-radius:8px;padding:8px 10px}.fleg i{width:14px;height:14px;border-radius:3px;flex:none}.fleg b{margin-inline-start:auto;font-size:18px}.fleg small{color:var(--mut)}

/* ---- combined layout ---- */
#vEnt.isK .kpis,#vEnt.isK #lead{display:none!important}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
@media(max-width:820px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bento .t{background:var(--panel);border-radius:22px;padding:16px;position:relative;overflow:hidden;color:inherit;text-decoration:none;min-height:118px;display:block}
.bento .t small{display:block;color:var(--mut);font-size:13px}.bento .t b{display:block;font-size:clamp(22px,3.2vw,30px);font-weight:800;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.bento .w2{grid-column:span 2}.bento .w4{grid-column:1/-1;background:var(--bg);border:1px solid var(--line)}table.cmp{font-size:12px}table.cmp th{white-space:normal;vertical-align:bottom;line-height:1.3}table.cmp td,table.cmp th{padding:8px 4px}table.cmp td:first-child{font-weight:700;white-space:normal;min-width:5.5em}table.cmp tr.chg td{border-top:2px solid var(--ink);font-weight:800}.bento .dark{background:#0B193A;color:#fff}.bento .dark small{color:#b9c6dc}.bento .gold{background:#D4B85A;color:#0B193A}.bento .gold small{color:#4b3d12}
.bento .dark .up{color:#9fe3b8}.bento .dark .dn{color:#ffa3a3}
.mini{display:flex;align-items:flex-end;gap:5px;height:56px;margin-top:10px}.mini i{flex:1;background:#D4B85A;border-radius:5px 5px 0 0;min-height:3px}
.mlab{display:flex;gap:5px;font-size:11px;color:#b9c6dc;margin-top:3px}.mlab span{flex:1;text-align:center}
.th{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.th b{font-size:16px!important;margin:0!important}.th a{color:var(--sage);font-weight:700;text-decoration:none;font-size:14px}
.lr{display:grid;grid-template-columns:1.4em 8.5em 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-size:14px}.lr:last-child{border:0}
.lr .no{color:var(--sage);font-weight:800}.lr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lr .tr{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.lr .tr i{display:block;height:100%;background:var(--navy)}.lr b{font-size:14px!important;margin:0!important}
.bento .lnk .go{position:absolute;bottom:12px;left:14px;width:30px;height:30px;border-radius:50%;background:#0000000f;display:grid;place-items:center;font-weight:800}.bento .dark .go{background:#ffffff1f}
.bento .food{background:light-dark(#f3ecd6,#2a2412)}
/* country header (A) + story (B) */
#vEnt.isC .head{background:linear-gradient(135deg,#0B193A,#173063 70%,#244176);color:#fff;border-radius:24px;padding:20px 18px 72px;align-items:flex-start;border-bottom:4px solid #D4B85A}
#vEnt.isC .head .en{color:#b9c6dc}#vEnt.isC .unit{color:#b9c6dc}
#vEnt.isC .head .cur button{background:#ffffff12;color:#fff;border-color:#ffffff33}#vEnt.isC .head .cur button[aria-pressed=true]{background:#D4B85A;color:#0B193A;border-color:#D4B85A}
#hstory .rk{display:inline-block;margin-top:8px;background:#D4B85A;color:#0B193A;font-weight:800;font-size:13px;border-radius:999px;padding:3px 12px}
#hstory p{margin:10px 0 0;color:#e6ebf3;line-height:1.8;font-size:15px;max-width:44em}#hstory b{color:#fff}
#vEnt.isC #lead{display:none!important}
#vEnt.isC .kpis{margin-top:-56px;padding:0 10px;position:relative;z-index:1}
#vEnt.isC .agr{margin:0 0 6px}
#vEnt.isC .kpis .k{background:var(--bg);box-shadow:0 8px 24px #0b193a22;border-radius:18px}
.secnav{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 2px;margin:4px 0 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);scrollbar-width:none}
.secnav button{flex:none;font:700 14px Noto Naskh Arabic,sans-serif;border:0;background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:999px;min-height:40px;cursor:pointer}.secnav button.on{background:#0B193A;color:#fff}
/* bottom nav (A) on phones */
.bnav{display:none}

 .bnav button{flex:1;border:0;background:none;color:var(--mut);font:700 11px Noto Naskh Arabic,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;cursor:pointer}.bnav button i{font-style:normal;font-size:20px;line-height:1}
 .bnav button.on{color:#0B193A}.bnav button.on i{color:#B39020}
 .top .tabs{display:none}body{padding-bottom:76px}}
#vEnt .kpis .k.oilk{background:#0B193A!important;color:#fff}#vEnt .k.oilk small{color:#b9c6dc;display:block}#vEnt .k.oilk b{color:#D4B85A}#vEnt .k.oilk .src{font-size:11px;opacity:.8;margin-top:4px}#vEnt .k.oilk .up{color:#9fe3b8}#vEnt .k.oilk .dn{color:#ffa3a3}
.mapw svg,.flowg svg{background:#0B193A!important;border-radius:16px}.mapw svg{padding:6px}
.ctry.hit{fill:transparent;stroke:none;cursor:pointer}.ctry.hit:hover{fill:#ffffff22;stroke:#D4B85A;stroke-width:.6}
.flowg .am{stroke:#9fb3d9}.flowg .ax{stroke:#D4B85A}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:54px;height:auto;flex:none;filter:drop-shadow(0 2px 6px #0006)}.brand .min{color:#D4B85A;font-weight:800;font-size:14px;letter-spacing:.2px;border-bottom:1.5px solid #D4B85A55;display:inline-block;padding-bottom:2px;margin-bottom:4px}

#intro{position:fixed;inset:0;z-index:100;overflow:auto;color:#fff;background:radial-gradient(60% 45% at 50% 38%,#2a4a8f 0%,#14285a 45%,#0B193A 100%);transition:opacity .6s,transform .6s}
#intro.out{opacity:0;transform:scale(1.04);pointer-events:none}
.istars{position:absolute;inset:0;background-image:radial-gradient(#ffffff55 1px,transparent 1.5px),radial-gradient(#ffffff33 1px,transparent 1.5px);background-size:140px 140px,90px 90px;background-position:0 0,45px 60px;opacity:.5;pointer-events:none}
.iin{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px 32px;text-align:center}

@keyframes iup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes igrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

@media(prefers-reduced-motion:reduce){#intro *{animation:none!important}}
body.noscroll{overflow:hidden}
/* header in same theme */

/* glowing ministry name */

.imin{animation:idrop 2.2s .8s cubic-bezier(.16,1,.3,1) both,mglow2 2.2s 3.2s ease-in-out infinite alternate}
@keyframes mglow{from{text-shadow:0 0 6px #D4B85A66;color:#D4B85A}to{text-shadow:0 0 8px #ffe9a8,0 0 18px #D4B85A,0 0 34px #D4B85Acc,0 0 56px #D4B85A80;color:#ffe7a3}}

/* fill-up animations */
.trk i,.bar2 i,.tr i{animation:fillw 1.3s cubic-bezier(.16,1,.3,1) both}
@keyframes fillw{from{width:0}}
.fig svg rect,.fig svg polygon{transform-box:fill-box;transform-origin:50% 100%;animation:barup 1.1s cubic-bezier(.16,1,.3,1) both}
.fig svg polyline,.fig svg path{stroke-dasharray:2000;animation:drawl 1.6s .3s ease both}
@keyframes barup{from{transform:scaleY(0)}}
@keyframes drawl{from{stroke-dashoffset:2000}to{stroke-dashoffset:0}}
.fig svg path[fill^="url"]{stroke-dasharray:none;animation:idot 1.2s .4s ease both}

 return `<svg class="gauge" viewBox="0 0 74 46"><path d="M6 40A31 31 0 0 1 68 40" fill="none" stroke="#ffffff1f" stroke-width="8" stroke-linecap="round"/><path d="M6 40A31 31 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round"/><text x="37" y="40" text-anchor="middle" fill="#fff" style="font:800 15px Montserrat">${v}</text></svg>`;}
function flowSVG(bl){const mx=Math.max(bl.x,bl.m,1),wx=3+13*Math.sqrt(bl.x/mx),wm=3+13*Math.sqrt(bl.m/mx);
 const L1=EN?55:305,R1=EN?305:55; // X on start side
 const p1=`M${L1} 78 C ${L1+(R1-L1)*.3} 10, ${L1+(R1-L1)*.7} 10, ${R1} 78`,p2=`M${R1} 102 C ${R1+(L1-R1)*.3} 170, ${R1+(L1-R1)*.7} 170, ${L1} 102`;
 return `<svg viewBox="0 0 360 184"><defs><clipPath id="cc"><circle r="30"/></clipPath><linearGradient id="g1"><stop offset="0" stop-color="#D4B85A"/><stop offset="1" stop-color="#f4e2a3"/></linearGradient></defs>
 <path class="ar" d="${p1}" stroke="#D4B85A" stroke-opacity=".75" stroke-width="${wx}"/><path class="ar ani" d="${p1}" stroke="#fff6d6" stroke-opacity=".85" stroke-width="2"/>
 <path class="ar" d="${p2}" stroke="#5e9e8f" stroke-opacity=".85" stroke-width="${wm}"/><path class="ar ani" d="${p2}" stroke="#e6fff7" stroke-opacity=".85" stroke-width="2"/>
 <text x="180" y="66" text-anchor="middle" fill="#f4e2a3" style="font-weight:800;font-size:15px">${usd(bl.x)}</text><text x="180" y="81" text-anchor="middle" fill="#c9d2e3" style="font-size:10.5px">${L('صادرات '+nm(X)+' إلى '+nm(Y),nm(X)+' exports to '+nm(Y))}</text>
 <text x="180" y="116" text-anchor="middle" fill="#bdeee0" style="font-weight:800;font-size:15px">${usd(bl.m)}</text><text x="180" y="131" text-anchor="middle" fill="#c9d2e3" style="font-size:10.5px">${L('واردات '+nm(X)+' من '+nm(Y),nm(X)+' imports from '+nm(Y))}</text>
 <g transform="translate(${L1} 90)"><circle r="33" fill="#0B193A" stroke="#D4B85A" stroke-width="2.5"/><image href="${flag(X)}" x="-30" y="-30" width="60" height="60" preserveAspectRatio="xMidYMid slice" clip-path="url(#cc)"/></g>
 <g transform="translate(${R1} 90)"><circle r="33" fill="#0B193A" stroke="#8fd1bf" stroke-width="2.5"/><image href="${flag(Y)}" x="-30" y="-30" width="60" height="60" preserveAspectRatio="xMidYMid slice" clip-path="url(#cc)"/></g>
 <text x="180" y="98" text-anchor="middle" fill="#fff" style="font-size:10px;opacity:.55">${O.c[X].ly||O.c[X].y[O.c[X].y.length-1]}</text></svg>`;}
function pdots(n,t){let s='';for(let i=0;i<(t||3);i++)s+=`<i class="${i<n?'on':''}"></i>`;return s;}
let TMK='';function drawTM(still){const el=$('#tm');if(!el)return;const key=X+Y;if(!still&&TMK===key&&el.childElementCount)return;const anim=!still&&TMK!==key;TMK=key;const top=R.ops.slice(0,12);if(!top.length){el.innerHTML=`<div class="empty">${L('لا تتوفر بيانات كافية','Not enough data')}</div>`;return;}
 const W=el.clientWidth,H=el.clientHeight;const items=top.map((o,i)=>({o,i,v:Math.sqrt(o.pot)}));
 const rects=squarify(items,0,0,W,H);
 el.innerHTML=rects.map((r,j)=>{const o=r.o,sm=r.w<92||r.h<74,xs=r.w<58||r.h<48;const lx=EN?r.x:W-r.x-r.w;
  return `<div class="tl ${tileCls(o)}${sm?' sm':''}${xs?' xs':''}" data-k="${o.k}" style="left:${lx}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;${anim?`animation-delay:${j*40}ms`:'animation:none'}" title="${sn(o.k)}"><div class="tt"><span class="cd">HS ${o.k}</span></div><div><div class="n">${sn(o.k)}</div><div class="v">${usd(o.pot)}</div></div><div class="pd">${pdots(o.need,o.n)}</div></div>`;}).join('');
 el.querySelectorAll('.tl').forEach(t=>t.onclick=()=>sheet(t.dataset.k));}
function bars(list,val,col,extra){const mx=list.length?val(list[0]):1;return list.map(o=>`<div class="br" data-k="${o.k}"><div class="n"><span>${sn(o.k)}</span>${extra(o)}</div><div class="v">${usd(val(o))}</div><div class="tr"><i data-w="${Math.max(3,val(o)/mx*100)}" style="background:${col}"></i></div></div>`).join('')||`<div class="empty">–</div>`;}
function grow(){requestAnimationFrame(()=>document.querySelectorAll('.pane.on .tr i').forEach(i=>i.style.width=i.dataset.w+'%'));}
function sheet(k){const a=R.A[k]||{x:0},b=R.B[k]||{x:0,m:0,need:0,n:3},rca=R.rcaOf(k),cx=((O.c[X].cx||{})[Y]||{})[k],pot=Math.min(a.x,b.m),net=b.m-b.x;
 const v=(a.x&&b.m&&rca>=1&&net>0)?['g','',L('فرصة قوية: '+nm(X)+' منافسة و'+nm(Y)+' بحاجة إليها','Strong opportunity: '+nm(X)+' is competitive and '+nm(Y)+' needs it')]:(a.x&&b.m&&net>0)?['y','',L('فرصة محتملة: '+nm(Y)+' بحاجة إليها لكن حضور '+nm(X)+' محدود','Possible opportunity: '+nm(Y)+' needs it but '+nm(X)+'\'s supply is limited')]:['r','',L('فرصة ضعيفة: '+nm(Y)+' تنتجها محلياً أو '+nm(X)+' لا تصدّرها','Weak: '+nm(Y)+' produces it or '+nm(X)+' doesn\'t export it')];
 const rp=Math.min(100,rca/4*100);
 $('#shb').innerHTML=`<div class="gr"></div><div class="hd"><div><b>${sn(k)}</b><small>HS ${k} · ${full(k)}</small></div></div>
 <div class="vd ${v[0]}"><i></i>${v[2]}</div>
 <div class="sg"><div class="st"><small>${L('واردات '+nm(Y)+' سنوياً','Annual imports of '+nm(Y))}</small><b>${usd(b.m)}</b></div><div class="st"><small>${L('صادرات '+nm(X)+' سنوياً','Annual exports of '+nm(X))}</small><b>${usd(a.x)}</b></div>
 <div class="st"><small>${L('حجم الفرصة','Opportunity size')}</small><b style="color:#f4e2a3">${usd(pot)}</b></div><div class="st"><small>${cx!=null?L('يُصدَّر إليها حالياً','Already sold there'):L('صافي حاجة '+nm(Y),'Net need of '+nm(Y))}</small><b>${cx!=null?usd(cx):(net>0?usd(net):'–')}</b></div></div>
 <div class="mt"><div class="l"><span>${L('سنوات العجز لدى '+nm(Y),'Years '+nm(Y)+' was short')}</span><span class="pdot">${pdots(b.need,b.n)}</span></div></div>
 <div class="mt"><div class="l"><span>${L('تنافسية '+nm(X)+' (الميزة النسبية)','Competitiveness of '+nm(X)+' (RCA)')}</span><b>×${rca.toLocaleString('en-US',{maximumFractionDigits:1})}</b></div><div class="tk"><i style="width:${rp}%;background:${rca>=1?'#7fd3a5':'#D4B85A'}"></i></div></div>
 <button class="cl" type="button">${L('إغلاق','Close')}</button>`;
 $('#sh').classList.add('on');$('#shb .cl').onclick=()=>$('#sh').classList.remove('on');}

function brief(){const bl=bilat(X,Y),bal=bl.x-bl.m,ly=O.c[X].ly||O.c[X].y[O.c[X].y.length-1],yrs=O.c[X].y;
 const f1=v=>v.toLocaleString('en-US',{maximumFractionDigits:1});
 const tag=o=>o.rca>=1&&o.net>0?['g',L('قوية','Strong')]:o.net>0?['y',L('محتملة','Possible')]:['r',L('محدودة','Limited')];
 const lv=R.TCI>=40?L('عالٍ','high'):R.TCI>=25?L('متوسط','moderate'):L('منخفض','low');
 const top=R.ops.slice(0,10),strong=top.filter(o=>o.rca>=1&&o.net>0).slice(0,3).map(o=>sn(o.k));
 const d=new Date().toLocaleDateString(EN?'en-GB':'ar-KW-u-nu-latn',{day:'numeric',month:'long',year:'numeric'});
 const summ=L(`يبلغ مؤشر التكامل التجاري بين صادرات ${nm(X)} وواردات ${nm(Y)} ${R.TCI} من 100 (مستوى ${lv}). بلغت صادرات ${nm(X)} إلى ${nm(Y)} ${usd(bl.x)} مقابل واردات بقيمة ${usd(bl.m)} في ${ly}.${strong.length?` وتتركز أبرز الفرص في: ${strong.join('، ')}.`:''}`,
  `The trade complementarity index between ${nm(X)}'s exports and ${nm(Y)}'s imports is ${R.TCI} out of 100 (${lv}). In ${ly}, ${nm(X)} exported ${usd(bl.x)} to ${nm(Y)} and imported ${usd(bl.m)}.${strong.length?` The strongest opportunities are in ${strong.join(', ')}.`:''}`);
 const mini=(list,val,ex)=>`<table><thead><tr><th>HS</th><th>${L('السلعة','Product')}</th><th class="num">${L('القيمة','Value')}</th><th class="num">${ex[0]}</th></tr></thead><tbody>${list.slice(0,6).map(o=>`<tr><td>${o.k}</td><td>${sn(o.k)}</td><td class="num">${usd(val(o))}</td><td class="num">${ex[1](o)}</td></tr>`).join('')}</tbody></table>`;
 $('#brief').innerHTML=`<div class="bh"><div><div class="br1">Trade<span>lexity</span></div><div class="br2">GLOBAL TRADE FINANCE INTELLIGENCE</div></div><div class="dt">${L('موجز فرص التبادل التجاري','Trade Opportunity Brief')}<br>${d}</div></div>
 <div class="ttl"><img src="${flag(X)}" alt=""><span class="ar">${EN?'→':'←'}</span><img src="${flag(Y)}" alt=""><div><h2>${L('فرص صادرات '+nm(X)+' إلى '+nm(Y),nm(X)+' export opportunities in '+nm(Y))}</h2><small>${L('متوسط '+yrs[0]+'–'+yrs[yrs.length-1]+' · القيم بالدولار الأمريكي','Average '+yrs[0]+'–'+yrs[yrs.length-1]+' · values in US dollars')}</small></div></div>
 <div class="kr"><div class="kk"><small>${L('مؤشر التكامل التجاري','Trade Complementarity Index')}</small><b>${R.TCI} / 100</b></div><div class="kk"><small>${L('الصادرات إلى '+nm(Y),'Exports to '+nm(Y))} (${ly})</small><b>${usd(bl.x)}</b></div><div class="kk"><small>${L('الواردات من '+nm(Y),'Imports from '+nm(Y))} (${ly})</small><b>${usd(bl.m)}</b></div><div class="kk"><small>${L('الميزان التجاري','Trade balance')}</small><b style="color:${bal>=0?'#2f6f61':'#a13d3d'}">${(bal<0?'−':'+')+usd(Math.abs(bal))}</b></div></div>
 <div class="sum">${summ}</div>
 <h3>${L('أبرز 10 فرص تصديرية','Top 10 export opportunities')}</h3>
 <table><thead><tr><th>#</th><th>HS</th><th>${L('السلعة','Product')}</th><th class="num">${L('واردات '+nm(Y),nm(Y)+' imports')}</th><th class="num">${L('صادرات '+nm(X),nm(X)+' exports')}</th><th class="num">${L('حجم الفرصة','Opportunity')}</th><th class="num">${L('سنوات العجز','Shortage yrs')}</th><th class="num">RCA</th><th>${L('التقييم','Rating')}</th></tr></thead>
 <tbody>${top.map((o,i)=>{const t=tag(o);return `<tr><td>${i+1}</td><td>${o.k}</td><td>${sn(o.k)}</td><td class="num">${usd(o.bm)}</td><td class="num">${usd(o.ax)}</td><td class="num"><b>${usd(o.pot)}</b></td><td class="num">${o.need}/${o.n}</td><td class="num">${f1(o.rca)}</td><td><span class="tg ${t[0]}">${t[1]}</span></td></tr>`;}).join('')}</tbody></table>
 <div class="cols"><div><h3>${L('أكبر احتياجات '+nm(Y),'Largest needs of '+nm(Y))}</h3>${mini(R.lacks,o=>o.net,[L('سنوات العجز','Shortage'),o=>o.need+'/'+o.n])}</div>
 <div><h3>${L('نقاط قوة '+nm(X)+' التصديرية','Export strengths of '+nm(X))}</h3>${mini(R.str,o=>o.x,['RCA',o=>f1(o.rca)])}</div></div>
 <div class="nt">${L('المنهجية: مؤشر التكامل التجاري = 100 × (1 − ½ Σ|حصة السلعة في واردات السوق − حصتها في صادرات الدولة المصدّرة|). حجم الفرصة = الأصغر بين صادرات الدولة المصدّرة وواردات السوق من السلعة. الميزة النسبية الظاهرة (RCA) = حصة السلعة من صادرات الدولة ÷ حصتها من إجمالي صادرات الدول المشمولة؛ أكبر من 1 تعني ميزة تنافسية. سنوات العجز = عدد السنوات التي تجاوزت فيها واردات السوق صادراته من السلعة. البيانات على مستوى فصول النظام المنسق (HS 2 أرقام). تُحتسب الصادرات الثنائية بالأعلى بين بيانات الدولة المصدّرة وبيانات الشريك (البيانات المرآتية) لشمول صادرات النفط الخام.<br>المصادر: قاعدة بيانات الأمم المتحدة لتجارة السلع (UN Comtrade)؛ إحصاءات التجارة الخارجية – الإدارة المركزية للإحصاء (دولة الكويت). المؤشرات استرشادية ولا تمثل دراسة جدوى.',
  'Methodology: Trade complementarity index = 100 × (1 − ½ Σ|product share of market imports − product share of exporter exports|). Opportunity = the smaller of the exporter\'s exports and the market\'s imports of the product. Revealed comparative advantage (RCA) = product share of the country\'s exports ÷ its share of total exports of covered countries; above 1 indicates competitiveness. Shortage years = years in which the market\'s imports exceeded its exports of the product. Data at HS 2-digit chapter level. Bilateral exports use the higher of exporter-reported and partner-reported (mirror) figures so that crude oil is captured.<br>Sources: UN Comtrade database; Foreign Trade Statistics – Central Statistical Bureau (State of Kuwait). Indicators are for guidance and do not constitute a feasibility study.')}</div>`;
 const imgs=[...document.querySelectorAll('#brief img')];Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;}))).then(()=>setTimeout(()=>window.print(),150));}
function setTab(t){TAB=t;document.querySelectorAll('.otabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p'+t));if(t==='o')drawTM();grow();}
function render(){const ml=marketList();if(X===Y||![...$('#sY').options].some(o=>o.value===Y))Y=(ml&&ml[0]&&ml[0][0])||[...$('#sY').options][0].value;
 history.replaceState(null,'','?c='+X+'&to='+Y);document.title='Tradelexity – '+nm(X)+' → '+nm(Y);
 ['X','Y'].forEach(s=>{const c=s==='X'?X:Y;$('#f'+s).src=flag(c);$('#n'+s).textContent=nm(c);$('#s'+s).value=c;});
 $('#swT').href=$('#swT').dataset.h+(X==='KW'?'#kw':'?c='+X);$('#swF').href=$('#swF').dataset.h+'?c='+X;
 R=analyse();const bl=bilat(X,Y),bal=bl.x-bl.m,best=R.ops[0];
 const lv=R.TCI>=40?L('عالٍ','High'):R.TCI>=25?L('متوسط','Medium'):L('منخفض','Low');
 const yr=O.c[X].ly||O.c[X].y[O.c[X].y.length-1];
 $('#kp').innerHTML=`<div class="kc"><small>${L('صادرات '+nm(X)+' إلى '+nm(Y),nm(X)+' exports to '+nm(Y))}</small><b>${usd(bl.x)}</b><span class="ln" style="background:#D4B85A"></span></div>
  <div class="kc"><small>${L('واردات '+nm(X)+' من '+nm(Y),nm(X)+' imports from '+nm(Y))}</small><b>${usd(bl.m)}</b><span class="ln" style="background:#5e9e8f"></span></div>
  <div class="kc"><small>${L('الميزان التجاري','Trade balance')}</small><b class="${bal>=0?'up':'dn'}">${usd(Math.abs(bal))}</b><small>${L('لصالح '+nm(bal>=0?X:Y),'in favour of '+nm(bal>=0?X:Y))}</small><span class="ln" style="background:#8a94a6"></span></div>
  <div class="kc"><small>${L('مؤشر التكامل التجاري','Trade Complementarity Index')}</small>${gauge(R.TCI)}<small>${lv}</small></div>`;
 $('#tbo').textContent=L('لـ'+nm(X)+' في '+nm(Y),nm(X)+' in '+nm(Y));$('#tbn').textContent=nm(Y);$('#tbs').textContent=nm(X);
 $('#kyr').textContent=L('التبادل الثنائي · '+yr,'Bilateral trade · '+yr);
 $('#inf').onclick=()=>{$('#shb').innerHTML=`<div class="gr"></div><div class="hd"><span class="e"><svg class="hi" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v6M12 7.5h.01"/></svg></span><div><b>${L('كيف تُقرأ الصفحة','How to read this')}</b></div></div><div style="font-size:13px;line-height:1.8;color:#dfe7f5;margin-top:10px">${L('<b>مؤشر التكامل التجاري</b> (0–100): مدى توافق ما تصدّره الدولة الأولى مع ما تستورده الثانية؛ فوق 40 عالٍ، 25–40 متوسط، أقل من 25 منخفض.<br><b>المربعات</b>: كل مربع سلعة، وحجمه يمثل حجم الفرصة (الأصغر بين صادرات الأولى وواردات الثانية). الذهبي = فرصة قوية، الأخضر المائل للزرقة = حاجة قائمة بتنافسية أقل، الرمادي = منافسة محلية.<br><b>مؤشر العجز</b>: عدد السنوات (من 3) التي استوردت فيها السوق أكثر مما صدّرت.<br><b>الميزة النسبية ×</b>: أكثر من 1 تعني أن الدولة منافسة عالمياً في السلعة.<br>البيانات: فصول النظام المنسق، متوسط آخر 3 سنوات، بالدولار الأمريكي.','<b>Trade Complementarity Index</b> (0–100): how well the first country\'s exports match what the second imports; above 40 is high, 25–40 medium, below 25 low.<br><b>Tiles</b>: each tile is a product; its size is the opportunity (the smaller of the first country\'s exports and the market\'s imports). Gold = strong opportunity, teal = market need with lower competitiveness, slate = local competition.<br><b>Shortage marker</b>: years (of 3) the market imported more than it exported.<br><b>RCA ×</b>: above 1 means the country is globally competitive in that product.<br>Data: HS chapters, average of the latest 3 years, US$.')}</div><button class="cl" type="button">${L('إغلاق','Close')}</button>`;$('#sh').classList.add('on');$('#shb .cl').onclick=()=>$('#sh').classList.remove('on');};
 $('#hintO').innerHTML=`<span>${L('حجم المربع = حجم الفرصة','Tile size = opportunity size')}</span><span>${L('اختر أي سلعة لعرض التفاصيل','Select a product for details')}</span>`;
 $('#bn').innerHTML=`<div class="hint"><span>${L('صافي الواردات (الواردات − الصادرات)','Net imports (imports − exports)')}</span></div>`+bars(R.lacks,o=>o.net,'linear-gradient(90deg,#ef8b8b,#f3b0a0)',o=>`<span class="pdot">${pdots(o.need,o.n)}</span>`);
 $('#bs').innerHTML=`<div class="hint"><span>${L('الصادرات ذات الميزة النسبية','Exports with comparative advantage')}</span></div>`+bars(R.str,o=>o.x,'linear-gradient(90deg,#6fb5a6,#8fd1bf)',o=>`<span class="rca">×${o.rca.toLocaleString('en-US',{maximumFractionDigits:1})}</span>`);
 document.querySelectorAll('.br').forEach(b=>b.onclick=()=>sheet(b.dataset.k));
 setTab(TAB);}
Promise.all([fetch('opp.json').then(r=>r.json()),fetch('fin.json').then(r=>r.json())]).then(([o,f])=>{O=o;CH=o.ch;N=f.c;
 const cs=Object.keys(O.c).filter(c=>N[c]).sort((a,b)=>nm(a).localeCompare(nm(b),EN?'en':'ar'));
 if(!O.c[X])X='KW';if(!Y||!O.c[Y]){const p=O.c[X].p;Y=Object.keys(p).filter(c=>O.c[c]&&c!==X).sort((a,b)=>(p[b][0]+p[b][1])-(p[a][0]+p[a][1]))[0]||'SA';}
 const opts=cs.map(c=>`<option value="${c}">${nm(c)}</option>`).join('');$('#sX').innerHTML=opts;
 $('#sX').onchange=e=>{X=e.target.value;render();};$('#sY').onchange=e=>{Y=e.target.value;render();};
 $('#swap').onclick=()=>{$('#swap').classList.toggle('sp');[X,Y]=[Y,X];render();};
 document.querySelectorAll('.otabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
 $('#sh').onclick=e=>{if(e.target.id==='sh')$('#sh').classList.remove('on');};
 let rt,lw=innerWidth;addEventListener('resize',()=>{if(innerWidth===lw)return;lw=innerWidth;clearTimeout(rt);rt=setTimeout(()=>{if(TAB==='o')drawTM(true);},150);});
 $('#backIntro').onclick=()=>{location.href=$('#backIntro').dataset.h;};$('.lang').onclick=e=>{e.currentTarget.href=$('.lang').dataset.h+location.search;};
 $('#pdfb').onclick=brief;
 render();}).catch(e=>console.error('OPPERR',e));
</script>
