<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B193A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kuwait-Tradelexity">
<link rel="apple-touch-icon" href="tl-apple-touch-icon.png">
<link rel="icon" type="image/png" href="tl-favicon.png">
<link rel="manifest" href="manifest.webmanifest?v=2">
<title>GCC-Tradelexity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE work: a statistics desk tool, calm and exact
   IDEA the trade ledger: every partner as a page of exports, imports and the balance between them
   PICTURE the 2015–2025 bar ledger per partner (exports mint, imports navy, balance marked) beside quarterly 2025–2026
   COLOUR white ground, near-black navy ink, mint and sage teal working colours, greys for context
   TYPE Almarai 800 for figures and titles, Almarai 400 for text
   LAYOUT search bar on top; partner title + four figures; chart full width; tables; ITC card; on phones everything stacks */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1620);--ink:light-dark(#131c27,#e8edf2);--mut:light-dark(#5f6874,#9aa6b2);--line:light-dark(#e2e6ea,#253141);--panel:light-dark(#ECEFF5,#16212d);--mint:#D4B85A;--sage:#B39020;--navy:light-dark(#0B193A,#9fb3d9);--grey:light-dark(#9aa1a9,#6d7883);--neg:light-dark(#b23a3a,#ef8d8d);--pos:light-dark(#2f7a52,#7fd3a5)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Almarai,Tahoma,sans-serif;overflow-x:clip}
.top{background:linear-gradient(135deg,#0B193A 0%,#173063 70%,#244176 100%);border-bottom:5px solid #D4B85A;color:#fff;padding:18px max(4vw,16px) 16px}
.top h1{margin:0;font-size:clamp(24px,4vw,34px);font-weight:800;line-height:1.1}
.top p{margin:4px 0 12px;color:#c9d2e3;font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar input{flex:1 1 220px;font:16px Almarai,sans-serif;padding:11px 14px;border-radius:10px;border:0;min-height:44px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:700 14px Almarai,sans-serif;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #2d4677;background:#ffffff0d;color:#e6ebf3;cursor:pointer}
.tabs button[aria-pressed=true]{background:#D4B85A;color:#0B193A;border-color:#D4B85A}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
#sugg{background:var(--bg);color:var(--ink);border-radius:10px;margin-top:6px;max-height:280px;overflow:auto;display:none;box-shadow:0 6px 18px #0003}
#sugg button{display:flex;justify-content:space-between;width:100%;text-align:start;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:15px Almarai,sans-serif;cursor:pointer;min-height:44px}
#sugg button span{color:var(--mut);font-size:13px}
main{padding:20px max(4vw,16px) 40px;max-width:1240px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h2{margin:0;font-size:clamp(26px,4vw,40px);line-height:1.05;font-weight:800}
.head .en{color:var(--mut);font-size:14px}
.unit{font-size:13px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:10px;margin:16px 0}
.k{background:var(--panel);border-radius:12px;padding:12px 14px}
.k b{display:block;font-size:clamp(20px,3vw,28px);font-weight:800;white-space:nowrap}
.k small{color:var(--mut);font-size:13px}
.k i{font-style:normal;font-size:13px;display:block}
.up{color:var(--pos)}.dn{color:var(--neg)}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{margin:0 0 8px;font-size:17px}
.fig{position:relative;min-height:300px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig.sm{min-height:240px}
svg text{font:12px Almarai,sans-serif;fill:var(--mut);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:6px}
.lg span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px;background:var(--c)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
th{color:var(--mut);font-weight:700;font-size:13px}
tr.sub td{color:var(--mut)}
.rank{display:grid;gap:6px}
.row{display:grid;grid-template-columns:2em 9.5em minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px;cursor:pointer;border:0;background:none;color:inherit;text-align:start;font-family:inherit;padding:4px 0;min-height:36px}
.row:hover .nm{text-decoration:underline}
.trk{height:14px;background:var(--panel);border-radius:4px;overflow:hidden;display:flex}
.trk i{display:block;height:100%}
.v{font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
select{font:15px Almarai,sans-serif;min-height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.itc{background:linear-gradient(0deg,var(--panel),var(--panel));border-inline-start:6px solid var(--sage)}
.itc dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:8px;margin:8px 0}
.itc dt{font-size:13px;color:var(--mut)}.itc dd{margin:0;font-weight:800;font-size:20px}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.copy{font:700 14px Almarai,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--sage);color:#fff;cursor:pointer}
.cur{display:inline-flex;gap:0;margin-inline-start:8px;vertical-align:middle}.cur button{font:700 13px Almarai,sans-serif;min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}.cur button:first-child{border-radius:0 8px 8px 0}.cur button:last-child{border-radius:8px 0 0 8px}.cur button[aria-pressed=true]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.lead{margin:12px 0 0;font-size:16px;line-height:1.8;background:var(--panel);border-inline-start:5px solid var(--sage);padding:10px 14px;border-radius:8px}
.agr{margin-top:8px;font-size:14px;color:var(--mut)}.agr b{color:var(--ink)}
.k .mp{display:block;margin-top:4px;color:var(--ink);font-weight:700;font-size:12.5px;white-space:normal}
.inds{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:8px}.inds div{background:var(--panel);border-radius:10px;padding:10px 12px}.inds small{display:block;color:var(--mut);font-size:13px}.inds b{font-size:18px;font-weight:800}
.ibs{display:grid;grid-template-columns:repeat(auto-fit,minmax(17em,1fr));gap:12px;margin-top:10px}.ib{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}.ib h4{margin:0;font-size:16px}.ib>small{color:var(--mut);font-size:13px}.ib.food{margin-top:12px;border-color:var(--mint)}
.bar2{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 8px}.bar2 i{display:block;height:100%;background:var(--mint)}
.pr{font-size:14px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(18em,1fr));gap:16px}
.rep h4{margin:14px 0 6px}.rep ul,.rep ol{margin:4px 0;padding-inline-start:20px}.rep p{margin:4px 0 8px;line-height:1.8}
tr.hl td{background:var(--panel);font-weight:700}
.fch{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:0 12px}.fch summary{cursor:pointer;padding:12px 0;display:flex;gap:8px;align-items:center;font-size:15px}.fch summary .v{margin-inline-start:auto;font-weight:800}.fch[open] summary{border-bottom:1px solid var(--line)}
tr.fr{cursor:pointer}tr.fr:hover td{background:var(--panel)}tr.fx>td{padding:8px 0;white-space:normal}.fi{margin:6px 0}a.row{text-decoration:none}.k a,td a{color:var(--navy);font-weight:700}
.fsug{display:none;border:1px solid var(--line);border-radius:10px;margin-top:-8px;margin-bottom:12px;max-height:300px;overflow:auto;box-shadow:0 6px 18px #0002;background:var(--bg)}.fsug button{display:flex;gap:8px;width:100%;text-align:start;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:15px Almarai,sans-serif;cursor:pointer;min-height:44px;align-items:center}.fsug button b{color:var(--navy)}.fsug button span{margin-inline-start:auto;color:var(--mut);font-size:13px}
tr.sep td{background:var(--navy);color:var(--bg);font-weight:800;font-size:13px;padding:6px 8px;border-top:3px solid var(--mint)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chip{font:700 13px Almarai,sans-serif;border:1px solid var(--navy);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer}.chip.clr{border-color:var(--line);color:var(--mut)}
.fsug button.all{font-weight:800;color:var(--sage)}.fsug button.on{background:var(--panel)}
table.fct td{padding:10px 8px}tr.fc{cursor:pointer}tr.fc:hover td,tr.fc.open td{background:var(--panel)}tr.fc td:first-child b{color:var(--navy)}.cnt{color:var(--mut);font-size:12px;font-weight:400}
tr.fx>td,tr.fy>td{padding:4px 0 10px;white-space:normal}table.sub{font-size:13px;background:var(--bg)}table.sub th{font-size:12px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.mh h3{margin:0}.mapw{position:relative;margin-top:8px}.mapw svg{width:100%;height:auto;display:block}
.ctry{cursor:pointer;transition:opacity .15s}.ctry:hover{opacity:.75;stroke:var(--ink);stroke-width:.8}
.mtip{position:absolute;display:none;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 4px 14px #0003;white-space:nowrap;z-index:2}
.flowg{display:grid;grid-template-columns:minmax(0,2fr) minmax(12em,1fr);gap:12px;align-items:center}@media(max-width:640px){.flowg{grid-template-columns:1fr}}
.flowg svg{width:100%;height:auto;display:block;border-radius:10px;background:light-dark(#f7f9fc,#121c27)}
.arc{fill:none;stroke-linecap:round;stroke-dasharray:6 5;animation:flow 1.6s linear infinite}.ax{stroke:var(--mint)}.am{stroke:var(--navy)}@keyframes flow{to{stroke-dashoffset:-22}}
@media(prefers-reduced-motion:reduce){.arc{animation:none}}
.ml{font-family:Almarai,sans-serif;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:.25em}
.fh{margin:0 0 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.fh .dk,.fh .dc{width:12px;height:12px;border-radius:50%;display:inline-block}.fh .dk{background:var(--navy)}.fh .dc{background:var(--sage)}.fh .ar{color:var(--mint)}
.fleg{display:grid;gap:8px}.fleg div{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--panel);border-radius:8px;padding:8px 10px}.fleg i{width:14px;height:14px;border-radius:3px;flex:none}.fleg b{margin-inline-start:auto;font-size:18px}.fleg small{color:var(--mut)}

/* ---- combined layout ---- */
#vEnt.isK .kpis,#vEnt.isK #lead{display:none!important}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
@media(max-width:820px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bento .t{background:var(--panel);border-radius:22px;padding:16px;position:relative;overflow:hidden;color:inherit;text-decoration:none;min-height:118px;display:block}
.bento .t small{display:block;color:var(--mut);font-size:13px}.bento .t b{display:block;font-size:clamp(22px,3.2vw,30px);font-weight:800;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.bento .w2{grid-column:span 2}.bento .w4{grid-column:1/-1;background:var(--bg);border:1px solid var(--line)}table.cmp{font-size:12px}table.cmp th{white-space:normal;vertical-align:bottom;line-height:1.3}table.cmp td,table.cmp th{padding:8px 4px}table.cmp td:first-child{font-weight:700;white-space:normal;min-width:5.5em}table.cmp tr.chg td{border-top:2px solid var(--ink);font-weight:800}.bento .dark{background:#0B193A;color:#fff}.bento .dark small{color:#b9c6dc}.bento .gold{background:#D4B85A;color:#0B193A}.bento .gold small{color:#4b3d12}
.bento .dark .up{color:#9fe3b8}.bento .dark .dn{color:#ffa3a3}
.mini{display:flex;align-items:flex-end;gap:5px;height:56px;margin-top:10px}.mini i{flex:1;background:#D4B85A;border-radius:5px 5px 0 0;min-height:3px}
.mlab{display:flex;gap:5px;font-size:11px;color:#b9c6dc;margin-top:3px}.mlab span{flex:1;text-align:center}
.th{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.th b{font-size:16px!important;margin:0!important}.th a{color:var(--sage);font-weight:700;text-decoration:none;font-size:14px}
.lr{display:grid;grid-template-columns:1.4em 8.5em 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-size:14px}.lr:last-child{border:0}
.lr .no{color:var(--sage);font-weight:800}.lr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lr .tr{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.lr .tr i{display:block;height:100%;background:var(--navy)}.lr b{font-size:14px!important;margin:0!important}
.bento .lnk .go{position:absolute;bottom:12px;left:14px;width:30px;height:30px;border-radius:50%;background:#0000000f;display:grid;place-items:center;font-weight:800}.bento .dark .go{background:#ffffff1f}
.bento .food{background:light-dark(#f3ecd6,#2a2412)}
/* country header (A) + story (B) */
#vEnt.isC .head{background:linear-gradient(135deg,#0B193A,#173063 70%,#244176);color:#fff;border-radius:24px;padding:20px 18px 72px;align-items:flex-start;border-bottom:4px solid #D4B85A}
#vEnt.isC .head .en{color:#b9c6dc}#vEnt.isC .unit{color:#b9c6dc}
#vEnt.isC .head .cur button{background:#ffffff12;color:#fff;border-color:#ffffff33}#vEnt.isC .head .cur button[aria-pressed=true]{background:#D4B85A;color:#0B193A;border-color:#D4B85A}
#hstory .rk{display:inline-block;margin-top:8px;background:#D4B85A;color:#0B193A;font-weight:800;font-size:13px;border-radius:999px;padding:3px 12px}
#hstory p{margin:10px 0 0;color:#e6ebf3;line-height:1.8;font-size:15px;max-width:44em}#hstory b{color:#fff}
#vEnt.isC #lead{display:none!important}
#vEnt.isC .kpis{margin-top:-56px;padding:0 10px;position:relative;z-index:1}
#vEnt.isC .agr{margin:0 0 6px}
#vEnt.isC .kpis .k{background:var(--bg);box-shadow:0 8px 24px #0b193a22;border-radius:18px}
.secnav{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 2px;margin:4px 0 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);scrollbar-width:none}
.secnav button{flex:none;font:700 14px Almarai,sans-serif;border:0;background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:999px;min-height:40px;cursor:pointer}.secnav button.on{background:#0B193A;color:#fff}
/* bottom nav (A) on phones */
.bnav{display:none}
@media(max-width:760px){.bnav{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bnav button{flex:1;border:0;background:none;color:var(--mut);font:700 11px Almarai,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;cursor:pointer}.bnav button i{font-style:normal;font-size:20px;line-height:1}
 .bnav button.on{color:#0B193A}.bnav button.on i{color:#B39020}
 .top .tabs{display:none}body{padding-bottom:76px}}
#vEnt .kpis .k.oilk{background:#0B193A!important;color:#fff}#vEnt .k.oilk small{color:#b9c6dc;display:block}#vEnt .k.oilk b{color:#D4B85A}#vEnt .k.oilk .src{font-size:11px;opacity:.8;margin-top:4px}#vEnt .k.oilk .up{color:#9fe3b8}#vEnt .k.oilk .dn{color:#ffa3a3}
.mapw svg,.flowg svg{background:#0B193A!important;border-radius:16px}.mapw svg{padding:6px}
.ctry.hit{fill:transparent;stroke:none;cursor:pointer}.ctry.hit:hover{fill:#ffffff22;stroke:#D4B85A;stroke-width:.6}
.flowg .am{stroke:#9fb3d9}.flowg .ax{stroke:#D4B85A}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:54px;height:auto;flex:none;filter:drop-shadow(0 2px 6px #0006)}.brand .min{color:#D4B85A;font-weight:800;font-size:14px;letter-spacing:.2px;border-bottom:1.5px solid #D4B85A55;display:inline-block;padding-bottom:2px;margin-bottom:4px}
@media(max-width:520px){.brand img{width:44px}.brand .min{font-size:12.5px}}

#intro{position:fixed;inset:0;z-index:100;overflow:auto;color:#fff;background:radial-gradient(60% 45% at 50% 38%,#2a4a8f 0%,#14285a 45%,#0B193A 100%);transition:opacity .6s,transform .6s}
#intro.out{opacity:0;transform:scale(1.04);pointer-events:none}
.istars{position:absolute;inset:0;background-image:radial-gradient(#ffffff55 1px,transparent 1.5px),radial-gradient(#ffffff33 1px,transparent 1.5px);background-size:140px 140px,90px 90px;background-position:0 0,45px 60px;opacity:.5;pointer-events:none}
.iin{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px 32px;text-align:center}
.iemb{width:clamp(80px,14vh,120px);height:auto;filter:drop-shadow(0 0 28px #ffffff40);animation:idrop 2.2s cubic-bezier(.16,1,.3,1) both}
.imin{font-weight:800;font-size:clamp(30px,7vw,48px);margin-top:14px;animation:iup 1.1s 1.1s cubic-bezier(.16,1,.3,1) both;text-shadow:0 2px 12px #0006}
.iline{width:min(60%,280px);height:2px;background:#D4B85A;margin:12px 0 10px;animation:idrop 2.2s 1.6s cubic-bezier(.16,1,.3,1) both;transform-origin:center}
.ien{color:#D4B85A;font-weight:700;font-size:clamp(13px,2.6vw,17px);direction:ltr;animation:idrop 2.2s 2.4s cubic-bezier(.16,1,.3,1) both}
.ititle{margin:18px 0 6px;font-size:clamp(18px,4vw,24px);color:#e6ebf3;font-weight:700;animation:iup 2.2s 3.2s cubic-bezier(.16,1,.3,1) both}
#imap{width:min(100%,900px);max-height:44vh;height:auto;margin-top:8px}
#imap .ct{transform-box:fill-box;transform-origin:center;opacity:0;animation:ict 2.2s cubic-bezier(.16,1,.3,1) forwards}
#imap .kwp{opacity:0;animation:idot .8s 5s ease forwards}
.iarc{fill:none;stroke:#D4B85A;stroke-width:1.4;stroke-dasharray:4 4;opacity:0;animation:iarc 1s ease forwards,flow 1.6s linear infinite}
.ibtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px;animation:iup 1s 5.6s ease both}
.ibtn{font:800 15px Almarai,sans-serif;min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid #D4B85A;background:#ffffff0d;color:#fff;cursor:pointer}
.ibtn.main{background:#D4B85A;color:#0B193A;min-width:220px;font-size:17px;min-height:52px;animation:ipulse 2.4s 6.8s ease-out infinite}
@keyframes iup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes igrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes idot{from{opacity:0}to{opacity:1}}
@keyframes iarc{to{opacity:.85}}
@keyframes iemb{0%{opacity:0;transform:scale(.6);filter:blur(8px)}60%{opacity:1;filter:blur(0) drop-shadow(0 0 40px #ffffff70)}100%{opacity:1;transform:none;filter:drop-shadow(0 0 28px #ffffff40)}}

.csw a[aria-current="true"]{border-color:var(--mint);background:#d4b85a22;font-weight:700}
</style>
<style>
.pick{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px 16px;text-align:center}
.pick h2{margin:0;font-size:1.7rem}.pick p{margin:0;color:var(--mut)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(120px,190px));gap:16px}
@media(max-width:560px){.pgrid{grid-template-columns:repeat(2,minmax(120px,1fr))}}
.pc{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px;border-radius:18px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;transition:transform .2s,border-color .2s}
.pc:hover{transform:translateY(-3px);border-color:var(--mint)}
.pc img{width:84px;height:56px;object-fit:cover;border-radius:6px;box-shadow:0 4px 14px #0006}
.csw{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0 2px}
.csw a{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.9rem}
.csw a img{width:22px;height:15px;object-fit:cover;border-radius:2px}
.csw a[aria-current="true"]{border-color:var(--mint);background:#d4b85a22;font-weight:700}
.tgl{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.tgl button{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.tgl button[aria-pressed="true"]{background:var(--mint);color:#0B193A;border-color:var(--mint);font-weight:700}
.gk{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0}
@media(max-width:700px){.gk{grid-template-columns:repeat(2,1fr)}}
.gk .k{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.gk .k small{display:block;color:var(--mut)}.gk .k b{display:block;font-size:1.45rem;margin:6px 0}
.srch{width:100%;max-width:420px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;margin:8px auto;display:block}
.gtbl tr.clk{cursor:pointer}.gtbl tr.clk:hover td{background:#ffffff0a}
.trk{height:8px;border-radius:6px;background:#ffffff12;overflow:hidden;min-width:60px}.trk i{display:block;height:100%;border-radius:6px}
.bk2{background:none;border:1px solid var(--line);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer;font:inherit;margin-bottom:10px}
.srcl{color:var(--mut);font-size:.82rem;text-align:center;margin:26px auto 90px;max-width:900px;line-height:1.8}
.dnote{color:var(--mut);font-size:.85rem;margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const QP=new URLSearchParams(location.search);
const EN=QP.get('lang')==='en';
if(EN){document.documentElement.lang='en';document.documentElement.dir='ltr';document.body.style.fontFamily="'Times New Roman',Times,serif";}
const T=(a,e)=>EN?e:a;
const fmtN=(v,d)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(a,b)=>b?((a-b)/Math.abs(b))*100:null;
const CO=[['KW','kw',T('الكويت','Kuwait')],['SA','sa',T('السعودية','Saudi Arabia')],['AE','ae',T('الإمارات','UAE')],['QA','qa',T('قطر','Qatar')],['BH','bh',T('البحرين','Bahrain')],['OM','om',T('عُمان','Oman')]];
const FLAG=iso=>`flags/${iso}.svg`;
const href=c=>c==='KW'?(EN?'en.html':'index.html'):`gcc.html?c=${c}${EN?'&lang=en':''}`;
let D=null,N=null,CUR='loc',UNIT='m',VIEW='ov',SEL=null;
let U={div:1000,lab:'',d:2,k:1};
// ---- picker ----
const code=(QP.get('c')||'').toUpperCase();
if(!['SA','AE','QA','BH','OM'].includes(code)){
  $('#app').innerHTML=`<div class="pick"><img src="emblem.png" alt="" width="70"><h2>${T('اختر الدولة','Choose a country')}</h2><p>${T('إحصاءات التجارة الخارجية لدول مجلس التعاون لدول الخليج العربية','Foreign trade statistics of the GCC countries')}</p>
  <div class="pgrid">${CO.map(([c,iso,n])=>`<a class="pc" href="${href(c)}"><img src="${FLAG(iso)}" alt="">${esc(n)}</a>`).join('')}</div>
  <a href="${EN?'en.html':'index.html'}" style="color:var(--mut)">${T('العودة إلى الصفحة الرئيسية','Back to home')}</a></div>`;
} else start();
window.addEventListener('hashchange',()=>{if(!D)return;const h=location.hash.slice(1);if(h&&h!==VIEW){VIEW=h;SEL=null;render();}});
async function start(){
  $('#app').innerHTML=`<div class="pick"><p>${T('جارٍ تحميل البيانات…','Loading data…')}</p></div>`;
  [D,N]=await Promise.all([fetch('gcc/'+code+'.json').then(r=>r.json()),fetch('gcc/names.json').then(r=>r.json())]);
  document.title='Tradelexity – '+(EN?D.en:D.ars);
  try{const h=location.hash.slice(1);if(h)VIEW=h;}catch(_){}
  render();
}
function unitFor(){const usd=CUR==='usd',c=usd?T('دولار','USD'):(EN?D.cen:D.cur);U={div:UNIT==='m'?1000:1,lab:(UNIT==='m'?T('مليون ','million '):T('ألف ','thousand '))+c,d:UNIT==='m'?2:1,k:usd?1:D.rate};}
// values stored in thousand USD
const cv=v=>v*U.k/U.div;
const f=v=>{const z=cv(v);if(z!==0&&Math.abs(z)<0.005)return '<0.01';return (z<0?'−':'')+fmtN(Math.abs(z),U.d);};
const chg=(a,b)=>{const c=pct(a,b);return c==null||!isFinite(c)?'–':`<span class="${c>=0?'up':'dn'}" dir="ltr">${c>=0?'+':'−'}${fmtN(Math.abs(c),1)}%</span>`;};
const pn=m=>{const z=N.p[m];return z?(EN?z[1]:z[0]):T('أخرى','Other')+' ('+m+')';};
const cn=h=>{const z=N.ch[h];return z?(EN?z[1]:z[0]):h;};
const yv=(o,y)=>(o&&o[y])||0;
const LY=()=>D.ly,PY=()=>String(+D.ly-1);
const QN={Q1:T('الربع الأول','Q1'),Q2:T('الربع الثاني','Q2'),Q3:T('الربع الثالث','Q3'),Q4:T('الربع الرابع','Q4'),H1:T('النصف الأول','H1'),H2:T('النصف الثاني','H2')};
const PL=p=>{const m=/^(\d{4})-(\w\d)$/.exec(p);return m?(EN?QN[m[2]]+' '+m[1]:QN[m[2]]+' '+m[1]):p;};
const half=o=>{const r={...(o||{})};['2025','2026'].forEach(y=>{const a=r[y+'-Q1']||0,b=r[y+'-Q2']||0;if(a||b)r[y+'-H1']=a+b;});return r;};
const HY=()=>D.q&&D.q.tot['2026-Q2']?'2026-H1':null;
const qx=()=>{const o={};Object.entries(D.q.tot).forEach(([k,v])=>o[k]=v.x);return half(o);},qm=()=>{const o={};Object.entries(D.q.tot).forEach(([k,v])=>o[k]=v.m);return half(o);};
const qsum=(ms,f)=>{const o={};ms.forEach(m=>{const z=D.q.p[m];if(z)Object.entries(z[f]).forEach(([k,v])=>o[k]=(o[k]||0)+v);});return half(o);};
function qtable(xo,mo){const per=Object.keys(D.q.tot).sort().reverse();const rows=[];if(HY())rows.push(['2026-H1','hl']);per.forEach(p=>{rows.push([p,'']);});return `<div class="scroll"><table><thead><tr><th>${T('الفترة','Period')}</th><th class="n">${T('الصادرات','Exports')}</th><th class="n">${T('الواردات','Imports')}</th><th class="n">${T('الميزان التجاري','Trade balance')}</th><th class="n">${T('التبادل التجاري','Total trade')}</th><th class="n">${T('التغير السنوي','YoY change')}</th></tr></thead><tbody>${rows.map(([p,c])=>{const x=yv(xo,p),m=yv(mo,p),pp=String(+p.slice(0,4)-1)+p.slice(4);const px=yv(xo,pp),pm=yv(mo,pp);return `<tr class="${c}"><td>${PL(p)}</td><td class="n">${f(x)}</td><td class="n">${f(m)}</td><td class="n ${x-m>=0?'up':'dn'}" dir="ltr">${f(x-m)}</td><td class="n">${f(x+m)}</td><td class="n">${px+pm?chg(x+m,px+pm):'–'}</td></tr>`;}).join('')}</tbody></table></div><div class="dnote">${U.lab}</div>`;}
const h1card=(xo,mo,ttl)=>HY()?`<div class="card" style="margin-bottom:16px"><h3>${ttl} – ${T('النصف الأول 2026 مقارنة بالنصف الأول 2025','H1 2026 vs H1 2025')}</h3>${kpis(xo,mo,'2026-H1','2025-H1')}</div>`:'';
const KW={414:1};
//---- chart (bars: exports/imports, line: balance) ----
function bars(el,labels,series){const draw=()=>{const W=el.clientWidth,H=el.clientHeight||260;if(!W)return;const pad={l:8,r:58,t:14,b:28},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;let mx=0,mn=0;series.forEach(s=>s.v.forEach(v=>{mx=Math.max(mx,v);mn=Math.min(mn,v);}));if(!mx&&!mn)mx=1;const y=v=>pad.t+ih*(mx-v)/(mx-mn),n=labels.length,bw=iw/n,bs=series.filter(s=>!s.line),gw=Math.min(bw*0.8,60),sw=gw/bs.length;let o='';for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,yy=y(v);o+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${W-pad.r+6}" y="${yy+4}">${esc(fmtN(cv(v),Math.abs(cv(v))>=100?0:1))}</text>`;}
 if(mn<0)o+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--grey)"/>`;
 const X=i=>EN?pad.l+bw*(i+.5):W-pad.r-bw*(i+.5);
 labels.forEach((l,i)=>{const cx=X(i);bs.forEach((s,k)=>{const v=s.v[i],x0=cx-gw/2+sw*k,y1=y(Math.max(v,0)),y2=y(Math.min(v,0)),w=Math.max(sw-2,1);o+=`<rect x="${x0+1}" y="${y1}" width="${w}" height="${Math.max(y2-y1,.5)}" rx="${Math.min(w/2,8)}" fill="url(#gg${s.id})" filter="url(#glow)"><title>${esc(l+' · '+s.n+': '+f(v)+' '+U.lab)}</title></rect>`;});if(W>=520||i%2===0)o+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(W<520?l.slice(2):l)}</text>`;});
 series.filter(s=>s.line).forEach(s=>{o+=`<polyline points="${labels.map((l,i)=>X(i)+','+y(s.v[i])).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2.5"/>`+labels.map((l,i)=>`<circle cx="${X(i)}" cy="${y(s.v[i])}" r="3.5" fill="${s.c}"><title>${esc(l+' · '+s.n+': '+f(s.v[i]))}</title></circle>`).join('');});
 const defs='<defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'+bs.map(s=>`<linearGradient id="gg${s.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.c}"/><stop offset="1" stop-color="${s.c}" stop-opacity=".45"/></linearGradient>`).join('')+'</defs>';
 el.innerHTML=`<svg style="direction:ltr;width:100%;height:100%" viewBox="0 0 ${W} ${H}">${defs}${o}</svg>`;};if(el._ro)el._ro.disconnect();const ro=new ResizeObserver(draw);ro.observe(el);el._ro=ro;draw();}
const legend=()=>`<div class="lg" style="display:flex;gap:14px;justify-content:center;font-size:.85rem;color:var(--mut)"><span>■ <span style="color:#D4B85A">${T('الصادرات','Exports')}</span></span><span>■ <span style="color:#9fb3d9">${T('الواردات','Imports')}</span></span><span>● <span style="color:#7fd3a5">${T('الميزان التجاري','Trade balance')}</span></span></div>`;
function series(xo,mo,yrs){return [{id:'x',n:T('الصادرات','Exports'),c:'#D4B85A',v:yrs.map(y=>yv(xo,y))},{id:'m',n:T('الواردات','Imports'),c:'#9fb3d9',v:yrs.map(y=>yv(mo,y))},{n:T('الميزان التجاري','Trade balance'),c:'#7fd3a5',line:1,v:yrs.map(y=>yv(xo,y)-yv(mo,y))}];}
function kpis(xo,mo,y,py){const x=yv(xo,y),m=yv(mo,y),px=yv(xo,py),pm=yv(mo,py);return `<div class="gk"><div class="k"><small>${T('الصادرات','Exports')} ${PL(y)}</small><b>${f(x)}</b>${chg(x,px)}</div><div class="k"><small>${T('الواردات','Imports')} ${PL(y)}</small><b>${f(m)}</b>${chg(m,pm)}</div><div class="k"><small>${T('الميزان التجاري','Trade balance')} ${PL(y)}</small><b class="${x-m>=0?'up':'dn'}" dir="ltr">${f(x-m)}</b><span style="color:var(--mut);font-size:.85rem">${PL(py)}: ${f(px-pm)}</span></div><div class="k"><small>${T('التبادل التجاري','Total trade')} ${PL(y)}</small><b>${f(x+m)}</b>${chg(x+m,px+pm)}</div></div><div class="dnote" style="text-align:center">${U.lab} · ${T('التغير مقارنة مع','change vs')} ${PL(py)}</div>`;}
function ytable(xo,mo,yrs){return `<div class="scroll"><table><thead><tr><th>${T('السنة','Year')}</th><th class="n">${T('الصادرات','Exports')}</th><th class="n">${T('الواردات','Imports')}</th><th class="n">${T('الميزان التجاري','Trade balance')}</th><th class="n">${T('التبادل التجاري','Total trade')}</th><th class="n">${T('التغير','Change')}</th></tr></thead><tbody>${[...yrs].reverse().map((y,i,a)=>{const x=yv(xo,y),m=yv(mo,y),p=a[i+1];return `<tr${i===0?' class="hl"':''}><td>${y}</td><td class="n">${f(x)}</td><td class="n">${f(m)}</td><td class="n ${x-m>=0?'up':'dn'}" dir="ltr">${f(x-m)}</td><td class="n">${f(x+m)}</td><td class="n">${p?chg(x+m,yv(xo,p)+yv(mo,p)):'–'}</td></tr>`;}).join('')}</tbody></table></div>`;}
const fig=id=>`<div class="fig" id="${id}" style="height:280px"></div>`;
const TX=()=>{const o={};D.years.forEach(y=>o[y]=D.tot[y].x);return o;},TM=()=>{const o={};D.years.forEach(y=>o[y]=D.tot[y].m);return o;};
const TABS=[['ov',T('الإجمالي','Overview')],['pt',T('الشركاء التجاريون','Trading partners')],['gr',T('المجموعات الاقتصادية','Economic groups')],['pr',T('السلع','Products')],['gcc',T('التجارة البينية الخليجية','Intra-GCC trade')],['fd',T('الأمن الغذائي','Food security')],['oil',T('الصادرات النفطية','Oil exports')],['itc',T('إمكانات التصدير','Export potential')]];
function render(){unitFor();
 const nm=EN?D.en:D.ar;
 $('#app').innerHTML=`<header class="top"><a class="lang" href="gcc.html?c=${code}${EN?'':'&lang=en'}">${EN?'عربي':'EN'}</a>
 <div class="brand"><img src="emblem.png" alt="" width="54" height="56"><div><div class="min">${T('وزارة التجارة والصناعة','Ministry of Commerce & Industry')}</div><h1>${T('إحصاءات التجارة الخارجية','Foreign trade statistics')} – ${esc(nm)}</h1></div></div>
 <div class="csw">${CO.map(([c,iso,n])=>`<a href="${href(c)}" aria-current="${c===code}"><img src="${FLAG(iso)}" alt="">${esc(n)}</a>`).join('')}</div>
 <div class="tgl"><button id="cL" aria-pressed="${CUR==='loc'}">${esc(EN?D.cen:D.curs)}</button><button id="cU" aria-pressed="${CUR==='usd'}">${T('دولار','USD')}</button><button id="uM" aria-pressed="${UNIT==='m'}">${T('مليون','Million')}</button><button id="uK" aria-pressed="${UNIT==='k'}">${T('ألف','Thousand')}</button></div>
 <div class="bar"><div class="tabs">${TABS.map(([k,l])=>`<button data-v="${k}" aria-pressed="${VIEW===k}">${l}</button>`).join('')}</div></div></header><main id="mn"></main>
 <div class="srcl">${D.src?T('المصدر: '+D.src.ar+'. ','Source: '+D.src.en+'. ')+T('التحويل إلى الدولار بسعر ثابت: 1 دولار = '+D.rate+' '+D.cur+'.','USD at a fixed rate: 1 USD = '+D.rate+' '+D.cen+'.'):`${T('المصدر: قاعدة بيانات الأمم المتحدة لإحصاءات تجارة السلع (UN Comtrade)، البيانات كما أبلغت عنها '+D.ars+'. آخر سنة متاحة: '+D.ly+'. التحويل بسعر صرف ثابت: 1 دولار = '+D.rate+' '+D.cur+'.','Source: UN Comtrade, as reported by '+D.en+'. Latest available year: '+D.ly+'. Converted at a fixed rate: 1 USD = '+D.rate+' '+D.cen+'.')}`}</div>`;
 $('#cL').onclick=()=>{CUR='loc';render();};$('#cU').onclick=()=>{CUR='usd';render();};$('#uM').onclick=()=>{UNIT='m';render();};$('#uK').onclick=()=>{UNIT='k';render();};
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;SEL=null;history.replaceState(null,'','#'+VIEW);render();window.scrollTo(0,0);});
 ({ov,pt,gr,pr,gcc,fd,oil,itc}[VIEW]||ov)();}
const M=h=>$('#mn').innerHTML=h;
function ov(){const xo=TX(),mo=TM();M(`${D.q?h1card(qx(),qm(),T('التجارة الخارجية','Foreign trade')+' – '+esc(EN?D.en:D.ars)):''}<div class="card"><h3>${T('التجارة الخارجية','Foreign trade')} – ${esc(EN?D.en:D.ars)} – ${LY()}</h3>${kpis(xo,mo,LY(),PY())}</div>
 <div class="card" style="margin-top:16px"><h3>${T('تطور التجارة الخارجية','Foreign trade over time')} ${D.years[0]}–${LY()} (${U.lab})</h3>${legend()}${fig('f1')}</div>
 ${D.q?`<div class="card" style="margin-top:16px"><h3>${T('البيانات الفصلية','Quarterly data')}</h3>${qtable(qx(),qm())}</div>`:''}<div class="card" style="margin-top:16px"><h3>${T('البيانات السنوية','Annual data')} (${U.lab})</h3>${ytable(xo,mo,D.years)}</div>
 ${(()=>{const L=top(LY()).slice(0,10);return `<div class="card" style="margin-top:16px"><h3>${T('أكبر 10 شركاء تجاريين','Top 10 trading partners')} – ${LY()}</h3>${ptable(L)}</div>`;})()}`);
 bars($('#f1'),D.years,series(xo,mo,D.years));bindP();}
function top(y){const tot=D.tot[y].x+D.tot[y].m;return Object.entries(D.p).map(([m,o])=>({m,x:yv(o.x,y),m_:yv(o.m,y),px:yv(o.x,String(+y-1)),pm:yv(o.m,String(+y-1))})).map(r=>({...r,t:r.x+r.m_,s:tot?(r.x+r.m_)/tot*100:0})).filter(r=>r.t>0).sort((a,b)=>b.t-a.t);}
function ptable(L){const mx=L.length?L[0].t:1;return `<div class="scroll"><table class="gtbl"><thead><tr><th>#</th><th>${T('الدولة','Country')}</th><th class="n">${T('الصادرات','Exports')}</th><th class="n">${T('الواردات','Imports')}</th><th class="n">${T('الميزان التجاري','Balance')}</th><th class="n">${T('التبادل التجاري','Total trade')}</th><th class="n">${T('الحصة','Share')}</th><th class="n">${T('التغير','Change')}</th><th style="width:14%"></th></tr></thead><tbody>${L.map((r,i)=>`<tr class="clk" data-p="${r.m}"><td>${i+1}</td><td><b>${esc(pn(r.m))}</b></td><td class="n">${f(r.x)}</td><td class="n">${f(r.m_)}</td><td class="n ${r.x-r.m_>=0?'up':'dn'}" dir="ltr">${f(r.x-r.m_)}</td><td class="n">${f(r.t)}</td><td class="n">${fmtN(r.s,1)}%</td><td class="n">${chg(r.t,r.px+r.pm)}</td><td><span class="trk" style="display:flex"><i style="width:${r.t/mx*100}%;background:var(--mint)"></i></span></td></tr>`).join('')}</tbody></table></div><div class="dnote">${U.lab}</div>`;}
function bindP(){document.querySelectorAll('tr[data-p]').forEach(t=>t.onclick=()=>{VIEW='pt';SEL=t.dataset.p;history.replaceState(null,'','#pt');render();window.scrollTo(0,0);});}
function htop(){const tot=(D.q.tot['2026-Q1'].x+D.q.tot['2026-Q2'].x+D.q.tot['2026-Q1'].m+D.q.tot['2026-Q2'].m);return Object.entries(D.q.p).map(([m,o])=>{const x=half(o.x),mm=half(o.m);return {m,x:x['2026-H1']||0,m_:mm['2026-H1']||0,px:x['2025-H1']||0,pm:mm['2025-H1']||0};}).map(r=>({...r,t:r.x+r.m_,s:(r.x+r.m_)/tot*100})).filter(r=>r.t>0).sort((a,b)=>b.t-a.t);}
function pt(){if(SEL&&D.p[SEL])return pprof(SEL);const L=top(LY());M(`${HY()?`<div class="card" style="margin-bottom:16px"><h3>${T('أكبر الشركاء التجاريين – النصف الأول 2026','Top trading partners – H1 2026')}</h3>${ptable(htop().slice(0,15))}<div class="dnote">${T('التغير مقارنة بالنصف الأول 2025','Change vs H1 2025')}</div></div>`:''}<div class="card"><h3>${T('الشركاء التجاريون','Trading partners')} – ${esc(EN?D.en:D.ars)} – ${LY()}</h3><input class="srch" id="ps" placeholder="${T('ابحث عن دولة…','Search for a country…')}"><div id="pl">${ptable(L.slice(0,40))}</div></div>`);bindP();
 $('#ps').oninput=e=>{const q=e.target.value.trim().toLowerCase();const R=q?L.filter(r=>pn(r.m).toLowerCase().includes(q)||(N.p[r.m]||[])[1]?.toLowerCase().includes(q)):L.slice(0,40);$('#pl').innerHTML=ptable(R);bindP();};}
function cpFor(m,f){const out=[];if(!D.cpy)return out;for(const [h,o] of Object.entries(D.cp)){const z=(o[f]||[]).find(r=>String(r[0])===String(m));if(z)out.push([h,z[1]]);}return out.sort((a,b)=>b[1]-a[1]).slice(0,10);}
function htable(L,tot,ttl){if(!L.length)return '';return `<div><h4 style="margin:10px 0 6px">${ttl}</h4><div class="scroll"><table><thead><tr><th>#</th><th>${T('الفصل','Chapter')}</th><th class="n">${T('القيمة','Value')}</th><th class="n">${T('الحصة','Share')}</th></tr></thead><tbody>${L.map(([h,v],i)=>`<tr><td>${i+1}</td><td style="white-space:normal"><b>${h}</b> ${esc(cn(h))}</td><td class="n">${f(v)}</td><td class="n">${tot?fmtN(v/tot*100,1)+'%':'–'}</td></tr>`).join('')}</tbody></table></div></div>`;}
function pprof(m){const o=D.p[m],ys=D.years;const yT=LY();const qp=D.q&&D.q.p[m];M(`<button class="bk2" id="bk">${EN?'←':'→'} ${T('كل الشركاء','All partners')}</button>${qp?h1card(half(qp.x),half(qp.m),pn(m)):''}<div class="card"><h3>${T('التبادل التجاري بين ','Trade between ')}${esc(EN?D.en:D.ars)} ${T('و','and ')}${esc(pn(m))}</h3>${kpis(o.x,o.m,yT,PY())}</div>
 <div class="card" style="margin-top:16px"><h3>${T('تطور التبادل التجاري','Trade over time')} (${U.lab})</h3>${legend()}${fig('f2')}</div>
 ${qp?`<div class="card" style="margin-top:16px"><h3>${T('البيانات الفصلية','Quarterly data')}</h3>${qtable(half(qp.x),half(qp.m))}</div>`:''}<div class="card" style="margin-top:16px"><h3>${T('البيانات السنوية','Annual data')}</h3>${ytable(o.x,o.m,ys)}</div>
 ${itcCard(m)}${D.cpy?`<div class="card" style="margin-top:16px"><h3>${T('أهم السلع (الفصول الجمركية)','Main products (HS chapters)')} – ${D.cpy}</h3>${htable(cpFor(m,'x'),yv(o.x,D.cpy),T('أهم الصادرات إلى ','Top exports to ')+pn(m))}${htable(cpFor(m,'m'),yv(o.m,D.cpy),T('أهم الواردات من ','Top imports from ')+pn(m))}<div class="dnote">${T('أهم 25 دولة لكل فصل؛ قد لا تظهر الفصول التي تقل فيها حصة الدولة.','Top 25 partners per chapter; smaller flows may not appear.')}</div></div>`:''}`);
 bars($('#f2'),ys,series(o.x,o.m,ys));$('#bk').onclick=()=>{SEL=null;render();};}
function gsum(ms,f,y){return ms.reduce((a,m)=>a+(D.p[m]?yv(D.p[m][f],y):0),0);}
function gr(){if(SEL&&D.groups[SEL])return gprof(SEL);const y=LY(),py=PY();const R=Object.entries(D.groups).map(([k,g])=>{const ms=g.m.filter(m=>String(m)!==String(D.m49));const x=gsum(ms,'x',y),mm=gsum(ms,'m',y),px=gsum(ms,'x',py),pm=gsum(ms,'m',py);return {k,g,x,mm,t:x+mm,pt:px+pm};}).sort((a,b)=>b.t-a.t);const tot=D.tot[y].x+D.tot[y].m;
 M(`<div class="card"><h3>${T('التجارة مع المجموعات الاقتصادية','Trade with economic groups')} – ${y}</h3><div class="scroll"><table class="gtbl"><thead><tr><th>${T('المجموعة','Group')}</th><th class="n">${T('الصادرات','Exports')}</th><th class="n">${T('الواردات','Imports')}</th><th class="n">${T('الميزان التجاري','Balance')}</th><th class="n">${T('التبادل التجاري','Total trade')}</th><th class="n">${T('الحصة','Share')}</th><th class="n">${T('التغير','Change')}</th></tr></thead><tbody>${R.map(r=>`<tr class="clk" data-g="${r.k}"><td><b>${esc(EN?r.g.en:r.g.ar)}</b></td><td class="n">${f(r.x)}</td><td class="n">${f(r.mm)}</td><td class="n ${r.x-r.mm>=0?'up':'dn'}" dir="ltr">${f(r.x-r.mm)}</td><td class="n">${f(r.t)}</td><td class="n">${fmtN(r.t/tot*100,1)}%</td><td class="n">${chg(r.t,r.pt)}</td></tr>`).join('')}</tbody></table></div><div class="dnote">${U.lab} · ${T('المجموعات محسوبة من بيانات الدول الأعضاء، وقد تتداخل (مثل جامعة الدول العربية ودول المجلس).','Groups are computed from member countries and may overlap.')}</div></div>`);
 document.querySelectorAll('tr[data-g]').forEach(t=>t.onclick=()=>{SEL=t.dataset.g;render();window.scrollTo(0,0);});}
function gprof(k){const g=D.groups[k],ms=g.m.filter(m=>String(m)!==String(D.m49)&&D.p[m]),ys=D.years,xo={},mo={};ys.forEach(y=>{xo[y]=gsum(ms,'x',y);mo[y]=gsum(ms,'m',y);});const L=top(LY()).filter(r=>ms.map(String).includes(String(r.m)));
 M(`<button class="bk2" id="bk">${EN?'←':'→'} ${T('كل المجموعات','All groups')}</button>${D.q?h1card(qsum(ms.map(String),'x'),qsum(ms.map(String),'m'),esc(EN?g.en:g.ar)):''}<div class="card"><h3>${esc(EN?g.en:g.ar)}</h3>${kpis(xo,mo,LY(),PY())}</div><div class="card" style="margin-top:16px"><h3>${T('تطور التبادل التجاري','Trade over time')}</h3>${legend()}${fig('f3')}</div><div class="card" style="margin-top:16px"><h3>${T('الدول الأعضاء','Member countries')} – ${LY()}</h3>${ptable(L)}</div>`);
 bars($('#f3'),ys,series(xo,mo,ys));$('#bk').onclick=()=>{SEL=null;render();};bindP();}
function chtable(hs,y,ttl,f2){const R=hs.map(h=>{const o=D.ch[h]||{x:{},m:{}};return {h,x:yv(o.x,y),m:yv(o.m,y),pv:yv(o[f2||'m'],String(+y-1))};}).filter(r=>r.x||r.m).sort((a,b)=>(f2==='x'?b.x-a.x:f2==='m'?b.m-a.m:(b.x+b.m)-(a.x+a.m)));
 return `<div class="scroll"><table class="gtbl"><thead><tr><th>${T('الفصل','Chapter')}</th><th class="n">${T('الصادرات','Exports')}</th><th class="n">${T('الواردات','Imports')}</th><th class="n">${T('الميزان التجاري','Balance')}</th>${f2?`<th class="n">${T('التغير','Change')}</th>`:''}</tr></thead><tbody>${R.map(r=>`<tr class="clk" data-h="${r.h}"><td style="white-space:normal;min-width:12em"><b>${r.h}</b> ${esc(cn(r.h))}</td><td class="n">${f(r.x)}</td><td class="n">${f(r.m)}</td><td class="n ${r.x-r.m>=0?'up':'dn'}" dir="ltr">${f(r.x-r.m)}</td>${f2?`<td class="n">${chg(f2==='x'?r.x:r.m,r.pv)}</td>`:''}</tr>`).join('')}</tbody></table></div><div class="dnote">${U.lab} · ${y}</div>`;}
function bindH(back){document.querySelectorAll('tr[data-h]').forEach(t=>t.onclick=()=>{SEL='h'+t.dataset.h;render();window.scrollTo(0,0);});}
function cprof(h){const o=D.ch[h]||{x:{},m:{}},ys=D.years.filter(y=>D.ch[h]&&(yv(o.x,y)||yv(o.m,y)));const cp=D.cp[h];const pl=(L,tot,ttl)=>!L||!L.length?'':`<div><h4 style="margin:10px 0 6px">${ttl}</h4><div class="scroll"><table class="gtbl"><thead><tr><th>#</th><th>${T('الدولة','Country')}</th><th class="n">${T('القيمة','Value')}</th><th class="n">${T('الحصة','Share')}</th></tr></thead><tbody>${L.slice(0,15).map(([m,v],i)=>`<tr class="clk" data-p="${m}"><td>${i+1}</td><td>${esc(pn(m))}</td><td class="n">${f(v)}</td><td class="n">${tot?fmtN(v/tot*100,1)+'%':'–'}</td></tr>`).join('')}</tbody></table></div></div>`;
 M(`<button class="bk2" id="bk">${EN?'←':'→'} ${T('رجوع','Back')}</button><div class="card"><h3><b>${h}</b> ${esc(cn(h))}</h3>${kpis(o.x,o.m,LY(),PY())}</div><div class="card" style="margin-top:16px"><h3>${T('تطور التجارة','Trade over time')} (${U.lab})</h3>${legend()}${fig('f4')}</div>
 ${cp?`<div class="card" style="margin-top:16px"><h3>${T('أهم الدول','Main partners')} – ${D.cpy}</h3>${pl(cp.x,yv(o.x,D.cpy),T('أهم وجهات الصادرات','Top export destinations'))}${pl(cp.m,yv(o.m,D.cpy),T('أهم الدول المورّدة','Top suppliers'))}</div>`:`<div class="card" style="margin-top:16px"><div class="note">${T('توزيع هذا الفصل حسب الدول غير متاح بعد لهذه الدولة.','A breakdown of this chapter by country is not yet available for this country.')}</div></div>`}`);
 bars($('#f4'),ys,series(o.x,o.m,ys));$('#bk').onclick=()=>{SEL=null;render();};bindP();}
function pr(){if(SEL&&SEL[0]==='h')return cprof(SEL.slice(1));const hs=Object.keys(D.ch).sort();M(`<div class="card"><h3>${T('التجارة حسب الفصول الجمركية (السلع)','Trade by HS chapter')} – ${LY()}</h3><input class="srch" id="hs" placeholder="${T('ابحث عن سلعة أو رقم فصل…','Search product or chapter…')}"><div id="hl">${chtable(hs,LY())}</div></div>`);bindH();
 $('#hs').oninput=e=>{const q=e.target.value.trim().toLowerCase();$('#hl').innerHTML=chtable(hs.filter(h=>!q||h.startsWith(q)||cn(h).toLowerCase().includes(q)),LY());bindH();};}
function gcc(){const ms=[414,682,784,634,48,512].filter(m=>String(m)!==String(D.m49)&&D.p[m]);const ys=D.years,xo={},mo={};ys.forEach(y=>{xo[y]=gsum(ms,'x',y);mo[y]=gsum(ms,'m',y);});const L=top(LY()).filter(r=>ms.map(String).includes(String(r.m)));
 M(`${D.q?h1card(qsum(ms.map(String),'x'),qsum(ms.map(String),'m'),T('التجارة البينية الخليجية','Intra-GCC trade')):''}<div class="card"><h3>${T('التجارة البينية الخليجية','Intra-GCC trade')} – ${esc(EN?D.en:D.ars)} – ${LY()}</h3>${kpis(xo,mo,LY(),PY())}</div><div class="card" style="margin-top:16px"><h3>${T('التجارة مع دول المجلس حسب الدولة','Trade with each GCC country')}</h3>${ptable(L)}</div><div class="card" style="margin-top:16px"><h3>${T('تطور التجارة البينية','Intra-GCC trade over time')}</h3>${legend()}${fig('f5')}</div><div class="card" style="margin-top:16px"><h3>${T('البيانات السنوية','Annual data')}</h3>${ytable(xo,mo,ys)}</div>`);
 bars($('#f5'),ys,series(xo,mo,ys));bindP();}

const ipn=l=>(l||[]).map(n=>EN?n:(N.itcp[n]||n)).join(T('، ',', '));
const ITCNOTE=()=>T('المصدر: مركز التجارة الدولية (ITC) – خريطة إمكانات التصدير، تقديرات 2031. القيم تقريبية (يقرّبها المركز). تشمل التقديرات الصادرات الوطنية فقط دون إعادة التصدير، لذا لا تُقارن مباشرة بإحصاءات التجارة.','Source: ITC Export Potential Map, estimates for 2031. Values are approximate (rounded by ITC). Estimates cover national exports only, not re-exports.');
function itcCard(m){const z=(D.itc||{})[m];if(!z)return '';const row=(o,ttl)=>!o?'':`<div class="k" style="text-align:start"><small>${ttl}</small><div style="display:flex;gap:18px;flex-wrap:wrap;margin:6px 0"><span>${T('إمكانات التصدير','Export potential')}: <b>${f(o.pot)}</b></span><span>${T('الإمكانات غير المستغلة','Untapped potential')}: <b>${f(o.gap)}</b></span><span>${T('المحقق','Realised')}: <b>${o.pot?fmtN((o.pot-o.gap)/o.pot*100,0):0}%</b></span></div><div style="color:var(--mut);font-size:.9rem">${T('أهم المنتجات: ','Top products: ')}${esc(ipn(o.prod))}</div></div>`;
 return `<div class="card" style="margin-top:16px"><h3>${T('إمكانات التصدير (تقديرات مركز التجارة الدولية 2031)','Export potential (ITC estimates, 2031)')}</h3><div class="gk" style="grid-template-columns:1fr">${row(z.out,T('من ','From ')+(EN?D.en:D.ars)+T(' إلى ',' to ')+pn(m))}${row(z.inn,T('من ','From ')+pn(m)+T(' إلى ',' to ')+(EN?D.en:D.ars))}</div><div class="dnote">${U.lab} · ${ITCNOTE()}</div></div>`;}
function itc(){const it=D.itc||{};const R=Object.entries(it).map(([m,z])=>({m,o:z.out,i:z.inn})).sort((a,b)=>((b.o||{}).pot||0)-((a.o||{}).pot||0));const w=D.itcw;
 const cell=o=>o?`<td class="n">${f(o.pot)}</td><td class="n">${f(o.gap)}</td><td style="white-space:normal;min-width:14em;font-size:.88rem">${esc(ipn(o.prod))}</td>`:'<td class="n">–</td><td class="n">–</td><td></td>';
 M(`<div class="card"><h3>${T('إمكانات التصدير – ','Export potential – ')}${esc(EN?D.en:D.ars)} (${T('تقديرات مركز التجارة الدولية 2031','ITC estimates, 2031')})</h3>${w?`<div class="gk" style="grid-template-columns:repeat(3,1fr)"><div class="k"><small>${T('إمكانات التصدير إلى العالم','Export potential to the world')}</small><b>${f(w.pot)}</b></div><div class="k"><small>${T('الإمكانات غير المستغلة','Untapped potential')}</small><b>${f(w.gap)}</b></div><div class="k"><small>${T('نسبة المحقق','Share realised')}</small><b>${fmtN((w.pot-w.gap)/w.pot*100,0)}%</b></div></div>`:''}<div class="dnote" style="text-align:center">${U.lab}</div></div>
 <div class="card" style="margin-top:16px"><h3>${T('الصادرات المحتملة إلى أهم الشركاء','Export potential to main partners')}</h3><div class="scroll"><table class="gtbl"><thead><tr><th>${T('الدولة','Country')}</th><th class="n">${T('إمكانات التصدير','Potential')}</th><th class="n">${T('غير المستغلة','Untapped')}</th><th>${T('أهم المنتجات','Top products')}</th></tr></thead><tbody>${R.filter(r=>r.o).map(r=>`<tr class="clk" data-p="${r.m}"><td><b>${esc(pn(r.m))}</b></td>${cell(r.o)}</tr>`).join('')}</tbody></table></div></div>
 <div class="card" style="margin-top:16px"><h3>${T('إمكانات الشركاء في التصدير إلى ','Partners’ export potential to ')}${esc(EN?D.en:D.ars)}</h3><div class="scroll"><table class="gtbl"><thead><tr><th>${T('الدولة','Country')}</th><th class="n">${T('إمكانات التصدير','Potential')}</th><th class="n">${T('غير المستغلة','Untapped')}</th><th>${T('أهم المنتجات','Top products')}</th></tr></thead><tbody>${R.filter(r=>r.i).sort((a,b)=>b.i.pot-a.i.pot).map(r=>`<tr class="clk" data-p="${r.m}"><td><b>${esc(pn(r.m))}</b></td>${cell(r.i)}</tr>`).join('')}</tbody></table></div><div class="dnote">${U.lab} · ${ITCNOTE()}</div></div>`);bindP();}

 <div class="card" style="margin-top:16px"><h3>${T('تطور تجارة السلع الغذائية','Food trade over time')}</h3>${legend()}${fig('f6')}</div>
 <div class="card" style="margin-top:16px"><h3>${T('الواردات الغذائية حسب الفصل','Food imports by chapter')}</h3>${chtable(FOOD,LY(),'','m')}</div>`);
 bars($('#f6'),ys,series(xo,mo,ys));bindH();}
function oil(){const o=D.ch['27']||{x:{},m:{}},ys=D.years;const x=yv(o.x,LY()),px=yv(o.x,PY()),tx=D.tot[LY()].x;const cp=(D.cp['27']||{}).x;
 const nonoil={};ys.forEach(y=>nonoil[y]=D.tot[y].x-yv(o.x,y));
 M(`<div class="card"><h3>${T('الصادرات النفطية (الفصل 27: الوقود المعدني والزيوت المعدنية) – ','Oil exports (HS 27: mineral fuels and oils) – ')}${LY()}</h3><div class="gk"><div class="k"><small>${T('الصادرات النفطية','Oil exports')}</small><b>${f(x)}</b>${chg(x,px)}</div><div class="k"><small>${T('الصادرات غير النفطية','Non-oil exports')}</small><b>${f(tx-x)}</b>${chg(tx-x,D.tot[PY()]?D.tot[PY()].x-px:0)}</div><div class="k"><small>${T('حصة النفط من الصادرات','Oil share of exports')}</small><b>${fmtN(x/tx*100,1)}%</b></div><div class="k"><small>${T('إجمالي الصادرات','Total exports')}</small><b>${f(tx)}</b></div></div><div class="dnote" style="text-align:center">${U.lab}</div></div>
 <div class="card" style="margin-top:16px"><h3>${T('الصادرات النفطية وغير النفطية','Oil and non-oil exports')} (${U.lab})</h3><div class="lg" style="display:flex;gap:14px;justify-content:center;font-size:.85rem;color:var(--mut)"><span style="color:#D4B85A">■ ${T('نفطية','Oil')}</span><span style="color:#9fb3d9">■ ${T('غير نفطية','Non-oil')}</span></div>${fig('f7')}</div>
